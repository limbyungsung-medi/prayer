<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쉬지 않는 기도</title>
<meta name="theme-color" content="#111111">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="쉬지 않는 기도">
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleIcon">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#111111; --card:#1a1a1a; --card2:#222222; --line:#2c2c2c; --text:#E6E6E6; --muted:#9b9b9b; --faint:#6f6f6f;
  --accent:#d8b45a; --accentInk:#1a1406; --accentSoft:rgba(216,180,90,.14);
  --teal:#1F4D4D; --good:#62b88f; --goodSoft:rgba(98,184,143,.15); --urgent:#e3705f; --urgentSoft:rgba(227,112,95,.15);
  --warn:#e2a54a; --shadow:0 10px 30px rgba(0,0,0,.45);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
:root.light{
  --bg:#f5f3ee; --card:#ffffff; --card2:#f1eee7; --line:#e3ded3; --text:#1d1b18; --muted:#6b665d; --faint:#9a958b;
  --accent:#a8801f; --accentInk:#fff; --accentSoft:rgba(168,128,31,.12);
  --teal:#d7ecec; --good:#2f8a5f; --goodSoft:rgba(47,138,95,.12); --urgent:#c4452f; --urgentSoft:rgba(196,69,47,.1);
  --warn:#b7791f; --shadow:0 10px 30px rgba(0,0,0,.15);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:16px; line-height:1.55; letter-spacing:-0.005em;}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));}
button,input,select,textarea{font-family:inherit; font-size:16px; color:inherit;}
a{color:inherit;}
.wrap{max-width:640px; margin:0 auto; padding:0 14px;}
header.top{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);}
header.top .wrap{display:flex; align-items:center; gap:8px; height:54px;}
.brand{font-weight:700; font-size:17px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand small{font-weight:500; color:var(--muted); font-size:13px; margin-left:6px;}
.iconbtn{background:none; border:0; width:40px; height:40px; border-radius:10px; display:grid; place-items:center; font-size:20px; cursor:pointer; color:var(--text);}
.iconbtn:active{background:var(--card2);}
nav.bottom{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);}
nav.bottom .wrap{display:flex; height:62px; padding:0;}
nav.bottom button{flex:1; background:none; border:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:12.5px; color:var(--muted); cursor:pointer;}
nav.bottom button .i{font-size:20px; line-height:1;}
nav.bottom button.on{color:var(--accent); font-weight:700;}
.fab{position:fixed; right:max(16px, calc(50% - 304px)); bottom:calc(76px + env(safe-area-inset-bottom)); z-index:31; width:58px; height:58px; border-radius:50%; border:0; background:var(--accent); color:var(--accentInk); font-size:32px; line-height:1; box-shadow:var(--shadow); cursor:pointer;}
h2{font-size:20px; margin:18px 0 6px;}
h3{font-size:16px; margin:16px 0 6px;}
.muted{color:var(--muted);} .faint{color:var(--faint);} .small{font-size:14px;} .tiny{font-size:12.5px;}
.row{display:flex; align-items:center; gap:8px;} .sp{flex:1;} .wrapflex{display:flex; flex-wrap:wrap; gap:6px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0;}
.btn{border:1px solid var(--line); background:var(--card2); border-radius:10px; padding:9px 14px; cursor:pointer; font-weight:600; font-size:15px; display:inline-flex; align-items:center; gap:6px; text-decoration:none;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accentInk);}
.btn.good{background:var(--goodSoft); border-color:transparent; color:var(--good);}
.btn.ghost{background:none;}
.btn.danger{color:var(--urgent); background:none;}
.btn.sm{padding:6px 10px; font-size:14px; border-radius:9px;}
.btn.block{width:100%; justify-content:center; padding:13px;}
.btn:disabled{opacity:.45;}
.chip{display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:1px 9px; font-size:12.5px; background:var(--card2); color:var(--muted); border:1px solid var(--line); white-space:nowrap;}
.chip.urgent{background:var(--urgentSoft); color:var(--urgent); border-color:transparent; font-weight:700;}
.chip.new{background:var(--accentSoft); color:var(--accent); border-color:transparent; font-weight:700;}
.chip.good{background:var(--goodSoft); color:var(--good); border-color:transparent;}
.chip.warn{color:var(--warn); border-color:transparent; background:rgba(226,165,74,.13); font-weight:700;}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none;}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; outline:none;}
textarea{min-height:70px; resize:vertical; line-height:1.5;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
label.f{display:block; font-size:13.5px; color:var(--muted); margin:12px 0 4px; font-weight:600;}
.seg{display:flex; background:var(--card2); border-radius:11px; padding:3px; gap:3px; border:1px solid var(--line);}
.seg button{flex:1; white-space:nowrap; border:0; background:none; padding:8px 4px; border-radius:9px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer;}
.seg button.on{background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.25);}
/* 오늘 */
.dayhead{padding:14px 0 4px;}
.dayhead .date{font-size:22px; font-weight:800;}
.dayhead .sub{color:var(--muted); font-size:14px;}
.weekdots{display:flex; gap:5px; margin-top:8px;}
.weekdots span{flex:1; text-align:center; font-size:12px; color:var(--faint); border-radius:8px; padding:3px 0; background:var(--card); border:1px solid var(--line);}
.weekdots span.done{background:var(--goodSoft); color:var(--good); border-color:transparent; font-weight:700;}
.weekdots span.today{outline:1.5px solid var(--accent);}
.step{background:var(--card); border:1px solid var(--line); border-radius:14px; margin:10px 0; overflow:hidden;}
.step .sh{display:flex; align-items:center; gap:10px; padding:14px; cursor:pointer;}
.step .num{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--card2); font-weight:800; font-size:14px; flex:none;}
.step.done .num{background:var(--goodSoft); color:var(--good);}
.step.open .num{background:var(--accent); color:var(--accentInk);}
.step .st{font-weight:700; font-size:17px;}
.step .ss{color:var(--muted); font-size:13.5px; margin-left:auto; text-align:right;}
.step .sb{padding:0 14px 14px; display:none;}
.step.open .sb{display:block;}
.verse{background:var(--accentSoft); border-radius:12px; padding:14px; font-size:18px;}
.verse b{font-size:20px;}
.secttl{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--muted); font-size:14px; margin:16px 0 6px;}
.secttl::after{content:""; flex:1; height:1px; background:var(--line);}
.pcard{border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin:8px 0; background:var(--bg);}
.pcard.prayed{opacity:.62;}
.pcard .pn{font-weight:700; font-size:17px; cursor:pointer;}
.pcard .items{margin:6px 0 2px; padding:0; list-style:none;}
.pcard .items li{padding:5px 0 5px 14px; position:relative; cursor:pointer; font-size:15.5px; border-top:1px dashed var(--line);}
.pcard .items li:first-child{border-top:0;}
.pcard .items li::before{content:"•"; position:absolute; left:2px; color:var(--faint);}
.cbtn{width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--card2); display:grid; place-items:center; font-size:16px; cursor:pointer; text-decoration:none; padding:0;}
.cbtn.off{opacity:.35;}
.kk{font-weight:900; font-size:12px; color:#3a1d1d; background:#fee500; border-color:#fee500;}
.praybtn{margin-top:8px; width:100%; border:1px dashed var(--line); background:none; border-radius:10px; padding:9px; font-weight:700; color:var(--muted); cursor:pointer;}
.pcard.prayed .praybtn{border-style:solid; color:var(--good); background:var(--goodSoft); border-color:transparent;}
.namechips{display:flex; flex-wrap:wrap; gap:6px;}
.namechips button{border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:6px 12px; font-size:15px; cursor:pointer;}
.namechips button.on{background:var(--goodSoft); color:var(--good); border-color:transparent;}
.note{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px; margin:8px 0;}
.note .ap{font-size:17px; font-weight:700; margin:4px 0;}
.empty{color:var(--muted); font-size:14.5px; padding:6px 0;}
.finish{margin:18px 0 8px;}
.banner{border-radius:12px; padding:11px 12px; background:var(--accentSoft); font-size:14.5px; margin:10px 0;}
.banner.warn{background:rgba(226,165,74,.13);}
/* 사람 */
.daygrid .dayb{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:8px 0;}
.daygrid .dayb.today{border-color:var(--accent);}
.dayb .dh{display:flex; align-items:center; gap:8px; font-weight:800; margin-bottom:6px;}
.pchip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:5px 11px; font-size:15px; cursor:pointer; margin:3px 3px 0 0;}
.pchip .pin{font-size:11px;}
.bar{height:6px; border-radius:3px; background:var(--card2); overflow:hidden; flex:1; max-width:120px;}
.bar i{display:block; height:100%; background:var(--accent);}
/* 시트 */
.ov{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.sheet{background:var(--card); width:100%; max-width:640px; max-height:92vh; overflow:auto; border-radius:18px 18px 0 0; padding:6px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow:var(--shadow);}
.sheet .grab{width:40px; height:5px; border-radius:3px; background:var(--line); margin:6px auto 4px;}
.sheet .shd{display:flex; align-items:center; gap:8px; position:sticky; top:-6px; background:var(--card); padding:8px 0; z-index:2;}
.sheet .shd b{font-size:18px; flex:1;}
.actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
.actions .btn{flex:1; justify-content:center;}
.radio{display:flex; flex-wrap:wrap; gap:6px;}
.radio button{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:8px 12px; font-size:14.5px; cursor:pointer;}
.radio button.on{background:var(--accent); color:var(--accentInk); border-color:var(--accent); font-weight:700;}
.check{display:flex; align-items:center; gap:8px; margin:10px 0; font-size:15px;}
.check input{width:20px; height:20px; accent-color:var(--accent);}
.list .li{display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-top:1px solid var(--line); cursor:pointer;}
.list .li:first-child{border-top:0;}
.tl .yr{font-size:22px; font-weight:800; margin:18px 0 4px;}
.tl .ent{border-left:2px solid var(--accent); padding:4px 0 12px 14px; margin-left:6px; position:relative; cursor:pointer;}
.tl .ent::before{content:""; position:absolute; left:-6px; top:10px; width:10px; height:10px; border-radius:50%; background:var(--accent);}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom)); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:12px; z-index:80; font-size:15px; font-weight:600; max-width:88vw; text-align:center; box-shadow:var(--shadow);}
.help p{margin:6px 0;} .help h3{margin-top:18px;}
.linkbtn{background:none; border:0; color:var(--accent); font-weight:700; cursor:pointer; padding:0; font-size:inherit;}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand" id="brand">쉬지 않는 기도</div>
  <button class="iconbtn" data-act="settings" aria-label="설정">⚙︎</button>
</div></header>
<main class="wrap" id="main"></main>
<button class="fab" data-act="quickAdd" aria-label="빠른 입력">＋</button>
<nav class="bottom"><div class="wrap">
  <button data-act="tab" data-tab="today"><span class="i">🕯️</span>오늘</button>
  <button data-act="tab" data-tab="people"><span class="i">👥</span>사람</button>
  <button data-act="tab" data-tab="words"><span class="i">📖</span>말씀</button>
  <button data-act="tab" data-tab="answers"><span class="i">🌿</span>응답</button>
</div></nav>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
"use strict";
var APP_VERSION = "2026-11-06-1";
var KEY = "swgido.v1";

/* ============ 날짜 ============ */
function pad(n){ return String(n).padStart(2,"0"); }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function today(){ return ymd(new Date()); }
function parseYmd(s){ var p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function dayNum(s){ var p=s.split("-").map(Number); return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5); }
function diff(a,b){ return dayNum(b)-dayNum(a); }           /* b - a (일) */
function dow(s){ return parseYmd(s).getDay(); }
function weekStart(s){ return addDays(s,-dow(s)); }
var DOW = ["일","월","화","수","목","금","토"];
function fmtDate(s){ if(!s) return ""; var d=parseYmd(s); return (d.getMonth()+1)+"월 "+d.getDate()+"일"; }
function fmtFull(s){ var d=parseYmd(s); return d.getFullYear()+". "+(d.getMonth()+1)+". "+d.getDate()+"."; }
function monthSlot(s){ return ((dayNum(s)%28)+28)%28; }

/* ============ 공통 ============ */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function toast(msg){ document.querySelectorAll('.toast').forEach(function(x){ x.remove(); }); var t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); },2200); }

/* ============ 저장 ============ */
var GROUP_COLORS = ["#d8b45a","#5fa8d3","#62b88f","#c97cc4","#e3705f","#8f8fe0","#d48a45","#7fb3a8","#b8b05a","#a0a0a0"];
function defaultState(){
  var names = ["파이오니아팀","한국네비게이토","STA지구","선교사","병원 직원","처가·친척","열방"];
  return {
    v:1,
    groups: names.map(function(n,i){ return {id:uid()+i, name:n, color:GROUP_COLORS[i%GROUP_COLORS.length], fixedDay:null}; }),
    people: [], items: [], notes: [], logs: {},
    settings: { cap:10, theme:"dark", short:false, lastBackup:"", started:today(),
      tpl:{ pray:"오늘 {이름}님을 위해 기도했어요. 요즘 어떠세요?",
            due:"어제 일은 어떻게 되었는지요? 계속 기도하고 있어요.",
            answer:"기도하던 일이 응답되었다니 함께 하나님께 감사해요!" } }
  };
}
var S;
function load(){
  try{ var raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : null; }catch(e){ S = null; }
  if(!S || !S.v) S = defaultState();
  var d = defaultState();
  S.settings = Object.assign({}, d.settings, S.settings||{});
  S.settings.tpl = Object.assign({}, d.settings.tpl, S.settings.tpl||{});
  ["people","items","notes","groups"].forEach(function(k){ if(!Array.isArray(S[k])) S[k]=[]; });
  if(!S.logs) S.logs = {};
}
var memOnly = false;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ if(!memOnly){ memOnly=true; toast("이 화면에서는 저장이 안 되어 임시로만 기억합니다"); } }
}
function log(d){ if(!S.logs[d]) S.logs[d] = {steps:{}, thanks:["","",""], prayed:[], praiseMemo:"", confess:""}; var L=S.logs[d]; if(!L.steps) L.steps={}; if(!L.thanks) L.thanks=["","",""]; if(!L.prayed) L.prayed=[]; return L; }

/* ============ 조회 ============ */
function person(id){ for(var i=0;i<S.people.length;i++) if(S.people[i].id===id) return S.people[i]; return null; }
function group(id){ for(var i=0;i<S.groups.length;i++) if(S.groups[i].id===id) return S.groups[i]; return null; }
function item(id){ for(var i=0;i<S.items.length;i++) if(S.items[i].id===id) return S.items[i]; return null; }
function note(id){ for(var i=0;i<S.notes.length;i++) if(S.notes[i].id===id) return S.notes[i]; return null; }
function activeItemsOf(pid){ return S.items.filter(function(it){ return it.personId===pid && it.status==="active"; }); }
function weight(p){ return Math.max(1, activeItemsOf(p.id).length); }
function gColor(gid){ var g=group(gid); return g ? g.color : "#777"; }
function gName(gid){ var g=group(gid); return g ? g.name : ""; }
function circleName(c){ return {daily:"매일",weekly:"매주",monthly:"한 달"}[c] || ""; }

/* ============ 요일 배정 — 섞어서 고르게 ============ */
function weeklyPeople(){ return S.people.filter(function(p){ return p.circle==="weekly"; }); }
function dayLoads(exceptId){
  var load=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0], gc={};
  weeklyPeople().forEach(function(p){
    if(p.id===exceptId || p.day==null) return;
    load[p.day]+=weight(p); cnt[p.day]++;
    var k=(p.groupId||"_")+"|"+p.day; gc[k]=(gc[k]||0)+1;
  });
  return {load:load, cnt:cnt, gc:gc};
}
function bestDay(p, L){
  var g = group(p.groupId);
  if(g && g.fixedDay!=null) return g.fixedDay;
  var best=0, bestScore=Infinity;
  for(var d=0; d<7; d++){
    var same = L.gc[(p.groupId||"_")+"|"+d]||0;
    var score = L.load[d] + same*1.0 + L.cnt[d]*0.01 + d*0.0001;
    if(score < bestScore){ bestScore=score; best=d; }
  }
  return best;
}
function place(p, L){ var d=bestDay(p,L); L.load[d]+=weight(p); L.cnt[d]++; var k=(p.groupId||"_")+"|"+d; L.gc[k]=(L.gc[k]||0)+1; return d; }
function assignPerson(p){
  if(p.circle==="weekly"){
    if(p.day==null){ p.day = bestDay(p, dayLoads(p.id)); p.dayFixed=false; }
    var g=group(p.groupId); if(g && g.fixedDay!=null){ p.day=g.fixedDay; }
  } else if(p.circle==="monthly"){
    if(p.slot==null){
      var c=new Array(28).fill(0); S.people.forEach(function(q){ if(q!==p && q.circle==="monthly" && q.slot!=null) c[q.slot]++; });
      var start = monthSlot(today()), best=start, bv=Infinity;
      for(var i=0;i<28;i++){ var s=(start+i)%28; if(c[s]<bv){ bv=c[s]; best=s; } }
      p.slot = best;
    }
  }
}
function rebalance(){
  var L={load:[0,0,0,0,0,0,0], cnt:[0,0,0,0,0,0,0], gc:{}};
  var fixed=[], free=[];
  weeklyPeople().forEach(function(p){
    var g=group(p.groupId);
    if(g && g.fixedDay!=null){ p.day=g.fixedDay; fixed.push(p); }
    else if(p.dayFixed && p.day!=null) fixed.push(p);
    else free.push(p);
  });
  fixed.forEach(function(p){ L.load[p.day]+=weight(p); L.cnt[p.day]++; var k=(p.groupId||"_")+"|"+p.day; L.gc[k]=(L.gc[k]||0)+1; });
  /* 큰 그룹부터, 그룹 안에서는 무거운 사람부터, 그룹을 번갈아 가며 배정 */
  var byG={}; free.forEach(function(p){ (byG[p.groupId||"_"]=byG[p.groupId||"_"]||[]).push(p); });
  var lists=Object.keys(byG).map(function(k){ return byG[k].sort(function(a,b){ return weight(b)-weight(a) || a.name.localeCompare(b.name); }); })
    .sort(function(a,b){ return b.length-a.length; });
  var order=[], more=true;
  for(var r=0; more; r++){ more=false; lists.forEach(function(l){ if(r<l.length){ order.push(l[r]); more=true; } }); }

}

function specialsFor(t){
  var map = {}, md = t.slice(5);
  function add(key, pid, it, tag){
    var e = map[key] || (map[key] = {pid:pid, tags:{}, items:{}});
    if(it){ (e.items[it.id] = e.items[it.id] || []).push(tag); } else e.tags[tag]=1;
  }
  S.items.forEach(function(it){
    if(it.status!=="active" || it.personId==="me") return;
    var key = it.personId || ("none:"+it.id);
    if(it.urgent) add(key, it.personId, it, "긴급");
    var age = diff(it.created, t);
    if(age>=0 && age<=2) add(key, it.personId, it, "새 제목");
    if(it.due){ var dd=diff(t,it.due); if(dd===0) add(key,it.personId,it,"오늘"); else if(dd===1) add(key,it.personId,it,"내일"); else if(dd===-1) add(key,it.personId,it,"결과 묻기"); }
  });
  S.people.forEach(function(p){ if(p.birthday && p.birthday===md) add(p.id, p.id, null, "생일 🎂"); });
  return map;
}
function todayPlan(t){
  var sp = specialsFor(t), seen = {};
  var daily = S.people.filter(function(p){ return p.circle==="daily"; });
  daily.forEach(function(p){ seen[p.id]=1; });
  var special = [];
  Object.keys(sp).forEach(function(k){ var e=sp[k]; if(e.pid && seen[e.pid]) return; if(e.pid) seen[e.pid]=1; special.push(e); });
  var d = dow(t), slot = monthSlot(t);
  var weekly = S.people.filter(function(p){ return p.circle==="weekly" && p.day===d && !seen[p.id]; })
    .sort(function(a,b){ return gName(a.groupId).localeCompare(gName(b.groupId)) || a.name.localeCompare(b.name); });
  var monthly = S.people.filter(function(p){ return p.circle==="monthly" && p.slot===slot && !seen[p.id]; });
  return {sp:sp, daily:daily, special:special, weekly:weekly, monthly:monthly};
}

var ACT = {
  tab:function(b){ UI.tab=b.dataset.tab; UI.open=null; render(); window.scrollTo(0,0); },
  closeSheet:closeSheet,
  settings:settingsSheet, help:helpSheet,
  quickAdd:function(b){ quickSheet(b.dataset.pid, b.dataset.kind); },

  openStep:function(b){ var k=b.dataset.k, cur=$("#step-"+k); UI.open = cur.classList.contains("open") ? "__none" : k; render(); },
  stepDone:function(b){
    var t=today(), L=log(t), k=b.dataset.k;
    if(L.steps[k]){ delete L.steps[k]; UI.open=k; save(); render(); return; }
    L.steps[k]=true; save();
    UI.open=null; render();
    var nx=document.querySelector(".step.open"); if(nx) nx.scrollIntoView({behavior:"smooth", block:"start"});
  },
  finishDay:function(){ var t=today(), L=log(t); L.done=true; save(); render(); toast("오늘도 기도의 자리를 지키셨습니다 🙏"); },
  welcomeSave:function(){
    var names = val("welcomeNames").split(/[,，、\n]/).map(function(s){ return s.trim(); }).filter(Boolean);
    if(!names.length) return toast("이름을 적어 주세요");
    names.forEach(function(n){ S.people.push({id:uid(), name:n, phone:"", groupId:"", circle:"daily", day:null, dayFixed:false, birthday:"", memo:"", created:today()}); });
    save(); render(); toast(names.length+"분을 매일 기도 대상으로 넣었습니다");
  },
  pray:function(b){
    var t=today(), L=log(t), id=b.dataset.id, i=L.prayed.indexOf(id);
    if(i>=0){ L.prayed.splice(i,1); activeItemsOf(id).forEach(function(it){ it.prayed=(it.prayed||[]).filter(function(d){ return d!==t; }); }); }
    else { L.prayed.push(id); activeItemsOf(id).forEach(function(it){ it.prayed=it.prayed||[]; if(it.prayed.indexOf(t)<0) it.prayed.push(t); }); }
    save(); var y=window.scrollY; render(); window.scrollTo(0,y);
  },
  openPerson:function(b){ personSheet(person(b.dataset.id)); },
  newPerson:function(){ personSheet(null); },
  savePerson:function(b){
    var name=val("pName"); if(!name) return toast("이름을 적어 주세요");
    var id=b.dataset.id, p=id?person(id):null, isNew=!p;
    if(isNew){ p={id:uid(), created:today(), lastContact:""}; S.people.push(p); }
    var oldCircle=p.circle, oldGroup=p.groupId;
    p.name=name; p.phone=val("pPhone"); p.groupId=$("#pGroup").value; p.circle=radioVal("pCircle")||"weekly"; p.birthday=val("pBirth"); p.memo=val("pMemo");
    if(p.circle==="weekly"){
      var dv=$("#pDay").value;
      if(dv==="auto"){ if(p.dayFixed || oldCircle!=="weekly" || oldGroup!==p.groupId || p.day==null){ p.dayFixed=false; p.day=null; } }
      else { p.day=Number(dv); p.dayFixed=true; }
    } else { p.dayFixed=false; p.day=null; }
    if(p.circle!=="monthly") p.slot=null;
    assignPerson(p); save(); closeSheet(); render();
    toast(p.circle==="weekly" ? p.name+"님 — "+DOW[p.day]+"요일에 기도합니다" : p.name+"님 — "+circleName(p.circle));
  },
  delPerson:function(b){
    var p=person(b.dataset.id); if(!p || !confirm(p.name+"님과 기도제목을 모두 삭제할까요?")) return;
    S.people=S.people.filter(function(x){ return x!==p; }); S.items=S.items.filter(function(it){ return it.personId!==p.id; });
    save(); closeSheet(); render();
  },
  openItem:function(b, e){ if(e && e.target.closest(".linkbtn")) return; var it=item(b.dataset.id); if(it) itemSheet(it); },
  saveItem:function(b){
    var it=item(b.dataset.id); if(!it) return;
    var title=val("iTitle"); if(!title) return toast("기도제목을 적어 주세요");
    var pid=$("#iPerson").value; if(pid==="__new") return toast("새 사람은 ＋ 버튼에서 추가해 주세요");
    var st=radioVal("iStatus")||"active";
    var oldPid=it.personId;
    it.title=title; it.detail=val("iDetail"); it.personId=pid||null; it.due=val("iDue"); it.verse=val("iVerse");
    if($("#iUrgent").checked && !it.urgent) it.urgentChecked=today(); it.urgent=$("#iUrgent").checked;
    if($("#iFocus")) it.focus=$("#iFocus").checked;
    if((st==="answered"||st==="other")){ it.answerText=val("iAns"); it.answerDate=val("iAnsDate")||today(); if(it.status!==st) it.urgent=false; }
    it.status=st; it.updated=today();
    save(); closeSheet(); render();
    if(st==="answered"||st==="other") toast("응답을 기록했습니다. 내일 감사 기도에 올라옵니다 🌿");
  },
  delItem:function(b){ if(!confirm("이 기도제목을 삭제할까요?")) return; S.items=S.items.filter(function(it){ return it.id!==b.dataset.id; }); save(); closeSheet(); render(); },
  urgentKeep:function(b){ var it=item(b.dataset.id); it.urgentChecked=today(); save(); render(); },
  urgentOff:function(b){ var it=item(b.dataset.id); it.urgent=false; save(); render(); },
  paste:function(){ navigator.clipboard.readText().then(function(x){ var ta=$("#qText"); ta.value = (ta.value?ta.value+"\n":"")+x.trim(); if(/\n/.test(ta.value)) $("#qSplit").checked = ta.value.split("\n").filter(function(s){return s.trim();}).length<=12; }).catch(function(){ toast("붙여넣기 권한이 없어요. 입력칸을 길게 눌러 붙여넣기 하세요"); }); },
  qSaveItem:function(){
    var text=$("#qText").value.trim(); if(!text) return toast("기도제목을 적어 주세요");
    var pid=$("#qPerson").value;
    if(pid==="__new"){
      var nm=val("qNewName"); if(!nm) return toast("새 사람 이름을 적어 주세요");
      var np={id:uid(), name:nm, phone:"", groupId:$("#qNewGroup").value, circle:"weekly", day:null, dayFixed:false, birthday:"", memo:"", created:today(), lastContact:""};
      S.people.push(np); pid=np.id;
    }
    var lines = $("#qSplit").checked ? text.split("\n").map(function(s){ return s.replace(/^\s*([-•·*]|\d+[.)])\s*/,"").trim(); }).filter(Boolean) : [text];
    lines.forEach(function(l){
      var title = l.length>60 && !$("#qSplit").checked ? l.split("\n")[0].slice(0,60) : l.split("\n")[0];
      S.items.push({id:uid(), personId:pid||null, title:title, detail:(l!==title?l:""), source:val("qSource"), created:today(), updated:today(), due:val("qDue"), urgent:$("#qUrgent").checked, urgentChecked:today(), status:"active", prayed:[], verse:"", focus:false});
    });
    var np2=person(pid); if(np2) assignPerson(np2);
    save(); closeSheet(); render();
    toast(lines.length>1 ? lines.length+"개의 기도제목을 저장했습니다" : (np2 && np2.circle==="weekly" ? "저장 · 3일간 매일, 이후 "+DOW[np2.day]+"요일" : "저장했습니다"));
  },
  qSaveNote:function(){
    var ap=val("qApply"), le=val("qLearned"); if(!ap && !le) return toast("배운 것이나 적용을 적어 주세요");
    S.notes.push(newNote({ref:val("qRef"), learned:le, apply:ap, source:$("#qNSource").value})); save(); closeSheet(); render(); toast("내일 다시 올라옵니다");
  },
  qSaveThanks:function(){ var x=val("qThanks"); if(!x) return; var L=log(today()); var i=L.thanks.findIndex(function(v,i){ return i<3 && !v; }); if(i>=0) L.thanks[i]=x; else L.thanks.push(x); save(); closeSheet(); render(); toast("감사 기도에 넣었습니다"); },
  qSaveFix:function(){ var x=val("qFix"); if(!x) return; S.notes.push(newNote({fix:x, source:"직접"})); save(); closeSheet(); render(); toast("자백 기도에 올라옵니다"); },
  fixDone:function(b){ var n=note(b.dataset.id); n.fixDone=today(); if(!n.apply) n.status="archived"; save(); render(); toast("감사합니다 🙏"); },
  newNote:function(){ noteSheet(null); },
  openNote:function(b){ var n=note(b.dataset.id); if(n) noteSheet(n); },
  saveNote:function(b){
    var id=b.dataset.id, n=id?note(id):null;
    var data={date:val("nDate")||today(), source:$("#nSource").value, preacher:val("nPreacher"), ref:val("nRef"), learned:val("nLearned"), apply:val("nApply"), fix:val("nFix")};
    if(!data.apply && !data.learned && !data.fix) return toast("배운 것·적용·고칠 것 중 하나는 적어 주세요");
    if(n){ Object.assign(n,data); var st=radioVal("nStatus"); if(st && st!==n.status){ n.status=st; if(st==="fruit") n.fruitDate=today(); if(st==="active" && (!n.next||n.next<today())) n.next=addDays(today(),1); } }
    else S.notes.push(newNote(data));
    save(); closeSheet(); render(); toast(n?"저장했습니다":"내일 다시 올라옵니다");
  },
  delNote:function(b){ if(!confirm("이 말씀노트를 삭제할까요?")) return; S.notes=S.notes.filter(function(n){ return n.id!==b.dataset.id; }); save(); closeSheet(); render(); },
  recall:function(b){
    var n=note(b.dataset.id), r=b.dataset.r, t=today(); n.log=n.log||[]; n.log.push({d:t, r:r});
    if(r==="yes"){ n.stepIdx=Math.min((n.stepIdx||0)+1, RECALL.length-1); n.next=addDays(t, RECALL[n.stepIdx]); toast(fmtDate(n.next)+"에 다시 봅니다"); }
    else if(r==="notyet"){ n.next=addDays(t,3); toast("3일 뒤 다시 봅니다"); }
    else if(r==="habit"){ n.status="fruit"; n.fruitDate=t; toast("열매로 옮겼습니다 🌿"); }
    else { n.status="archived"; }
    save(); var y=window.scrollY; render(); window.scrollTo(0,y);
  },
  pickWeek:function(){ var n=note($("#pickSel").value); if(!n) return; var wk=weekStart(today()); S.notes.forEach(function(x){ if(x.pick===wk) x.pick=""; }); n.pick=wk; save(); render(); toast("이번 주 개인 기도에 올라옵니다"); },
  pview:function(b){ UI.peopleView=b.dataset.v; render(); },
  rebalance:function(){ if(!confirm("고정(📌)하지 않은 분들의 요일을 고르게 다시 나눌까요?")) return; rebalance(); render(); toast("요일을 고르게 다시 나누었습니다"); },
  importContacts:function(){
    navigator.contacts.select(["name","tel"], {multiple:true}).then(function(list){
      if(!list || !list.length) return;
      var rows = list.map(function(c){ return {name:(c.name&&c.name[0])||"", tel:(c.tel&&c.tel[0])||""}; }).filter(function(r){ return r.name; });
      var h = '<div class="small">'+rows.map(function(r){ return esc(r.name)+(r.tel?' <span class="muted">'+esc(r.tel)+'</span>':''); }).join("<br>")+'</div>'+
        '<label class="f">그룹</label><select id="icGroup">'+groupOptions("")+'</select><label class="f">얼마나 자주</label>'+radio("icCircle", [["daily","매일"],["weekly","매주"],["monthly","한 달"]], "weekly")+
        '<div class="actions"><button class="btn primary block" id="icSave">'+rows.length+'명 넣기</button></div>';
      openSheet("연락처에서 불러오기", h, function(){ $("#icSave").onclick=function(){
        var g=$("#icGroup").value, c=radioVal("icCircle")||"weekly";
        rows.forEach(function(r){ var p={id:uid(), name:r.name, phone:r.tel, groupId:g, circle:c, day:null, dayFixed:false, birthday:"", memo:"", created:today(), lastContact:""}; S.people.push(p); assignPerson(p); });
        save(); closeSheet(); render(); toast(rows.length+"명을 넣었습니다");
      }; });
    }).catch(function(){});
  },
  contacted:function(b){ var p=person(b.dataset.id); if(p){ p.lastContact=today(); save(); } },
  msg:function(b){ var p=person(b.dataset.id); if(p) msgSheet(p, b.dataset.kind); },
  sendSms:function(b){ var p=person(b.dataset.id), t=$("#mText").value; p.lastContact=today(); save(); location.href="sms:"+p.phone.replace(/[^\d+]/g,"")+(isIOS?"&":"?")+"body="+encodeURIComponent(t); },
  sendKakao:function(b){
    var p=person(b.dataset.id), t=$("#mText").value; p.lastContact=today(); save();
    if(navigator.share){ navigator.share({text:t}).catch(function(){}); }
    else { copyText(t); toast("문구를 복사했어요. 카카오톡에 붙여넣으세요"); }
  },
  copyMsg:function(b){ var p=person(b.dataset.id); p.lastContact=today(); save(); copyText($("#mText").value); toast("복사했습니다"); },
  copyYear:function(){
    var y=today().slice(0,4), lines=["["+y+"년 응답된 기도]"];
    S.items.filter(function(it){ return (it.status==="answered"||it.status==="other") && it.answerDate && it.answerDate.slice(0,4)===y; }).sort(function(a,b){ return a.answerDate<b.answerDate?-1:1; })
      .forEach(function(it){ var p=person(it.personId); lines.push("• "+fmtDate(it.answerDate)+" "+(p?p.name+" — ":"")+it.title+(it.answerText?" → "+it.answerText:"")+" ("+daysTxt(it)+")"); });
    copyText(lines.join("\n")); toast("복사했습니다");
  },
  saveSettings:function(){
    var st=S.settings; st.theme=radioVal("sTheme")||st.theme; st.cap=Math.max(3, Number(val("sCap"))||10);
    st.tpl={pray:val("tPray"), due:val("tDue"), answer:val("tAns")};
    var changed=false;
    document.querySelectorAll("[data-gname]").forEach(function(e){ var g=group(e.dataset.gname); if(g && e.value.trim()) g.name=e.value.trim(); });
    document.querySelectorAll("[data-gday]").forEach(function(e){ var g=group(e.dataset.gday); var v=e.value===""?null:Number(e.value); if(g && g.fixedDay!==v){ g.fixedDay=v; changed=true; } });
    if(changed) rebalance();
    save(); closeSheet(); render(); toast("저장했습니다");
  },
  addGroup:function(){ var n=prompt("새 그룹 이름"); if(!n||!n.trim()) return; S.groups.push({id:uid(), name:n.trim(), color:GROUP_COLORS[S.groups.length%GROUP_COLORS.length], fixedDay:null}); save(); settingsSheet(); },
  delGroup:function(b){ var g=group(b.dataset.id); if(!g || !confirm('"'+g.name+'" 그룹을 지울까요? (사람들은 "그룹 없음"으로 남습니다)')) return; S.groups=S.groups.filter(function(x){ return x!==g; }); S.people.forEach(function(p){ if(p.groupId===g.id) p.groupId=""; }); save(); settingsSheet(); },
  backup:function(){
    var t=today(), data=JSON.stringify(S), name="쉬지않는기도_백업_"+t+".json";
    var file; try{ file=new File([data], name, {type:"application/json"}); }catch(e){}
    var done=function(){ S.settings.lastBackup=t; save(); render(); };
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:name}).then(function(){ done(); toast("백업을 보냈습니다"); }).catch(function(){});
    } else {
      var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); done(); toast("백업 파일을 내려받았습니다");
    }
  },
  restore:function(){ $("#fileIn").click(); },
  checkUpdate:function(){
    if(!("serviceWorker" in navigator)) return location.reload();
    navigator.serviceWorker.getRegistration().then(function(r){ return r && r.update(); }).catch(function(){}).then(function(){
      fetch(location.href.split("#")[0], {cache:"no-store"}).then(function(res){ return res.text(); }).then(function(txt){
        var m=/APP_VERSION = "([^"]+)"/.exec(txt);
        if(m && m[1]!==APP_VERSION){ toast("새 버전으로 바꿉니다"); setTimeout(function(){ location.reload(); }, 800); } else toast("지금이 최신 버전입니다 ("+APP_VERSION+")");
      }).catch(function(){ toast("인터넷 연결을 확인해 주세요"); });
    });
  }
};
function daysTxt(it){ var n=diff(it.created,it.answerDate); return n<=0 ? '당일 응답' : n+'일 만에'; }
function newNote(d){ var t=today(); return Object.assign({id:uid(), date:t, source:"", preacher:"", ref:"", learned:"", apply:"", fix:"", stepIdx:0, next:addDays(t,1), log:[], status:"active", pick:""}, d); }
function copyText(t){ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(function(){ fallbackCopy(t); }); else fallbackCopy(t); }
function fallbackCopy(t){ var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} ta.remove(); }

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if(!b) return;
  var a = ACT[b.dataset.act]; if(!a) return;
  if(b.tagName==="A" && b.dataset.act!=="contacted") e.preventDefault();
  if(b.tagName==="LI" || b.classList.contains("note") || b.classList.contains("ent") || b.classList.contains("li")){ if(e.target.closest("button,a") && e.target.closest("button,a")!==b) return; }
  a(b, e);
});
var saveTimer=null;
document.addEventListener("input", function(e){
  var k = e.target.dataset && e.target.dataset.log; if(!k) return;
  var L = log(today());
  if(k.indexOf("thanks.")===0){ L.thanks[Number(k.split(".")[1])] = e.target.value; } else L[k] = e.target.value;
  clearTimeout(saveTimer); saveTimer=setTimeout(save, 400);
});
$("#fileIn").addEventListener("change", function(e){
  var f=e.target.files[0]; if(!f) return; var r=new FileReader();
  r.onload=function(){ try{ var d=JSON.parse(r.result); if(!d || !d.v || !Array.isArray(d.people)) throw 0;
      if(!confirm("백업을 불러오면 지금 휴대폰의 기록이 백업 내용으로 바뀝니다. 계속할까요?")) return;
      S=d; load2(); save(); closeSheet(); render(); toast("백업을 불러왔습니다");
    }catch(err){ toast("백업 파일이 아닌 것 같아요"); } };
  r.readAsText(f); e.target.value="";
});
function load2(){ var raw=JSON.stringify(S); try{ localStorage.setItem(KEY, raw); }catch(e){} load(); }

/* 날짜가 바뀌면(자정이 지나 앱을 다시 열면) 새로 그림 */
var lastDay = today();
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible" && today()!==lastDay){ lastDay=today(); UI.open=null; render(); } });

/* ============ 설치용 (manifest·아이콘) ============ */
function makeIcon(size){
  var c=document.createElement("canvas"); c.width=c.height=size; var x=c.getContext("2d"), s=size/512;
  x.fillStyle="#141414"; x.fillRect(0,0,size,size);
  var g=x.createRadialGradient(256*s,250*s,10*s,256*s,250*s,230*s); g.addColorStop(0,"rgba(216,180,90,.35)"); g.addColorStop(1,"rgba(216,180,90,0)"); x.fillStyle=g; x.fillRect(0,0,size,size);
  x.fillStyle="#d8b45a"; x.beginPath(); x.moveTo(256*s,96*s); x.bezierCurveTo(320*s,176*s,338*s,232*s,320*s,276*s); x.bezierCurveTo(304*s,316*s,280*s,330*s,256*s,330*s); x.bezierCurveTo(232*s,330*s,208*s,316*s,192*s,276*s); x.bezierCurveTo(174*s,232*s,192*s,176*s,256*s,96*s); x.fill();
  x.fillStyle="#f6e6b8"; x.beginPath(); x.moveTo(256*s,200*s); x.bezierCurveTo(282*s,240*s,286*s,268*s,276*s,290*s); x.bezierCurveTo(268*s,306*s,262*s,312*s,256*s,312*s); x.bezierCurveTo(250*s,312*s,244*s,306*s,236*s,290*s); x.bezierCurveTo(226*s,268*s,230*s,240*s,256*s,200*s); x.fill();
  x.fillStyle="#e9e4d8"; x.fillRect(222*s,346*s,68*s,96*s); x.fillStyle="#cfc8b8"; x.fillRect(200*s,438*s,112*s,18*s);
  return c.toDataURL("image/png");
}
try{
  var i192=makeIcon(192), i512=makeIcon(512);
  var mf={name:"쉬지 않는 기도", short_name:"쉬지않는기도", start_url:new URL("./",location.href).href, scope:new URL("./",location.href).href, display:"standalone", orientation:"portrait", background_color:"#111111", theme_color:"#111111",
    icons:[{src:i192,sizes:"192x192",type:"image/png",purpose:"any"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any"}]};
  $("#manifestLink").href="data:application/manifest+json;charset=utf-8,"+encodeURIComponent(JSON.stringify(mf));
  $("#appleIcon").href=i192;
}catch(e){}
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});

load(); render();
</script>
