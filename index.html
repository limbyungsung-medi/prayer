*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14213a}
body{font-family:Pretendard,"PingFang SC","Noto Sans SC","Microsoft YaHei",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);font-size:var(--fs);line-height:1.7;word-break:keep-all;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}

/* header */
header{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#14213a;color:#fff}

.hb{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;min-width:38px;height:38px;font-size:15px;font-family:inherit;padding:0 7px}
.hb.on{background:var(--gold);color:#14213a;font-weight:700}

/* stage */
#stage{position:relative;flex:0 0 auto;height:min(37vh,270px);overflow:hidden}
.sky{position:absolute;inset:0;transition:opacity 2.4s ease}
#skyDay{background:linear-gradient(#FBF7EE,#F3EBD9)}
#skyNight{background:linear-gradient(#0b1020,#2a2f4a 75%);opacity:0}
#skyDawn{background:linear-gradient(#FBF4E1,#F4E6C4);opacity:0}
.night #skyNight{opacity:1}
.dawn #skyDawn{opacity:1}
#stage svg{position:absolute;inset:0;width:100%;height:100%}
.tr{transition:transform 2.4s cubic-bezier(.45,0,.3,1),opacity 1.8s}
#L{transform:translateX(0)} #R{transform:translateX(0)}
.joined #L{transform:translateX(50px)} .joined #R{transform:translateX(-50px)}
#filler{opacity:0} .joined #filler{opacity:1}
#bond{opacity:0;transition:opacity 1s} .joined #bond,.crossed #bond2{opacity:1}
#bond2{opacity:0;transition:opacity 1.2s .3s}
#sinTxt{opacity:0;transition:opacity 1s .8s}
.split #sinTxt{opacity:1}
#deepTxt{opacity:0;transition:opacity 1s .4s}
.deep #deepTxt{opacity:1}

.cross #crossG{transform:translateY(0);opacity:1}
.night #P circle:not(#halo),.night #P path{fill:#f2f2f2;stroke:#f2f2f2}

.risen #riseG{opacity:1;transform:scale(1)}

.together .solo{display:none}
#rdBar{display:none;flex:1;gap:5px;min-width:0}

body.speaking #dots{display:none}

#rdBar button{flex:1;min-width:0;height:50px;border:0;border-radius:12px;background:#eef0f4;color:var(--blue);font-family:inherit;font-size:11px;font-weight:700;line-height:1.15;padding:2px}

#rdBar button.on{background:var(--gold);color:#14213a}

.rd-hide{display:none!important}
.rd-now{background:#fffaf0!important;box-shadow:0 0 0 6px #fffaf0;border-radius:10px;transition:background .4s}

#bibleBtn{display:none} .hasBible #bibleBtn{display:inline-block}

.hasBible .card .vref,.hasBible .train2 .vref{color:inherit}
.hasBible .note .vref{color:#a9cbff}
.train2{display:flex;align-items:flex-start;margin:34px 0 14px;padding-bottom:0;border-bottom:4px solid #7a6a55;position:relative;animation:trainIn 1.6s cubic-bezier(.2,.8,.3,1)}
.train2::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:4px;background:repeating-linear-gradient(90deg,#7a6a55 0 6px,transparent 6px 16px)}
@keyframes trainIn{from{transform:translateX(110%)}to{transform:none}}

.car b{font-size:1.2em}
.car.eng{border-radius:22px 10px 10px 10px}
.stack{position:absolute;top:-18px;left:16px;width:14px;height:20px;background:#1F3A5F;border-radius:3px 3px 0 0}
.stack::before{content:"";position:absolute;top:-4px;left:-3px;width:20px;height:6px;background:#14213a;border-radius:2px}
.stack i{position:absolute;left:-2px;top:-14px;width:16px;height:12px;border-radius:50%;background:#cfd6df;opacity:0;animation:puff 2.4s infinite}
.stack i:nth-child(2){animation-delay:1.2s}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(14px,-22px) scale(1.6)}}
.wheels{position:absolute;left:0;right:0;bottom:-16px;display:flex;justify-content:space-around}
.wheels i{width:18px;height:18px;border-radius:50%;background:#2b2b2b;border:3px solid #9a9a9a;box-sizing:border-box}
.link{flex:0 0 8px;height:6px;background:#555;align-self:flex-end;margin-bottom:24px;border-radius:2px}
body[data-lang=zh]{word-break:normal;line-break:strict}
#panel{overflow-x:hidden}
#panel *{overflow-wrap:anywhere}
#langPop{position:absolute;right:10px;top:56px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:6px;display:none;z-index:25}

.langRow{display:flex;gap:8px;margin:14px 0 4px}

body[data-lang=ko] .langRow button:first-child,body[data-lang=en] .langRow button:nth-child(2),body[data-lang=zh] .langRow button:nth-child(3),body[data-lang=ru] .langRow button:nth-child(4),body[data-lang=ne] .langRow button:nth-child(5){background:var(--blue);color:#fff}
textarea.inp{resize:vertical;font-size:.95em}

.crossed #halo{opacity:1}

.shake{animation:shake .7s}

.lbl{font-family:Pretendard,sans-serif;font-weight:700}
#stageCap{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:92%;text-align:center;color:#fff;font-size:15px;font-weight:700;background:rgba(20,33,58,.6);padding:4px 14px;border-radius:20px;pointer-events:none;white-space:nowrap}

/* content */
#panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px}

.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

.bubble.me{background:#fff4d6;border-radius:16px 16px 4px 16px;margin-left:30px}
.fade{animation:fade .5s}

.note{display:none;background:#1f2a3d;color:#e9eef6;border-radius:12px;padding:12px 14px;margin:14px 0;font-size:.85em;line-height:1.65}

.blank{display:inline-block;min-width:70px;text-align:center;border-bottom:2px solid var(--blue);color:transparent;cursor:pointer;padding:0 4px;border-radius:4px;background:#eef3f9;transition:all .3s}

.prayer{background:#fff;border:2px dashed var(--gold);border-radius:14px;padding:14px 16px;font-size:1.02em;line-height:1.95}
.train{display:flex;gap:6px;align-items:stretch;margin:10px 0}
.train div{flex:1;border-radius:10px;padding:8px 4px;text-align:center;font-size:.8em;line-height:1.35;color:#fff}

.card .big{font-size:1.35em;font-weight:800;color:#f7d58b}
input.inp{width:100%;font-size:1em;font-family:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;margin:6px 0}

/* nav */
nav{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
nav .nb{min-width:84px;height:50px;border-radius:14px;border:0;font-size:16px;font-weight:700;font-family:inherit}
#prev{background:#eef0f4;color:var(--blue)} #next{background:var(--blue);color:#fff}

#dots i{width:8px;height:8px;border-radius:50%;background:#d6d0c4}

/* toc */
#toc{position:absolute;inset:0;background:rgba(10,16,30,.55);display:none;z-index:20}

#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:rgba(20,33,58,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30;white-space:nowrap}

.effBlk .effHead::after{content:"  ✕";font-size:.85em;opacity:.8}
.sr{font-size:0}
.effBlk p{margin:.3em 0 .4em}

/* 사람 편 · 하나님 편 목록 (요 5:24) */
#manList text,#godList text,#tFree,#tHear,#tBelieve{opacity:0;transition:opacity .9s}
.deep #manList text{opacity:1}
.deep #manList #m2{transition-delay:.5s} .deep #manList #m3{transition-delay:1s}
.gift #godList text{opacity:1}
.gift #godList #g1{transition-delay:.4s} .gift #godList #g2{transition-delay:1.2s} .gift #godList #g3{transition-delay:2s}
.gift #tFree{opacity:1;transition-delay:2.6s}
.faith #tHear,.faith #tBelieve{opacity:1}
.crossed #manList text{opacity:.35}
.crossed #tFree{opacity:0;transition-delay:0s}
.crossed #godList text{fill:#F3DE9C;font-weight:700}
#tFree,#tHear,#tBelieve,#manList,#godList{font-family:Pretendard,"PingFang SC",sans-serif}
.night #tHear,.night #tBelieve{fill:#F7F2E6}

/* 간결 모드: 첫 화면 이후 위쪽 단추 줄을 숨기고 그림 모서리에 작은 단추 */
body.compact header{display:none}
#fab{position:absolute;top:8px;right:8px;display:none;gap:6px;z-index:6}
body.compact #fab{display:flex}
#fab button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(26,33,80,.86);color:#F3ECDA;box-shadow:0 1px 4px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;padding:0}
#fab .ic,#stage #fab svg{position:static;inset:auto;width:18px;height:18px;margin:0}
#fabBible{display:none!important} .hasBible #fabBible{display:flex!important}
body.compact #stageCap{left:10px;transform:none;max-width:calc(100% - 100px);white-space:normal;text-align:left;line-height:1.35}
#app{padding-top:0} body.compact #app{padding-top:env(safe-area-inset-top)}
#menuBox .mItem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:#F4F1EA;border-radius:12px;padding:12px;margin:0 0 8px;font-family:inherit;font-size:16px;font-weight:700;color:#1A2150}
#menuBox .mRow{display:flex;align-items:center;gap:6px;margin:0 0 8px}
#menuBox .mRow span{width:28px;display:flex;justify-content:center;color:#1A2150}
#menuBox .mRow button{flex:1;border:1px solid #d9d3c4;background:#fff;border-radius:10px;min-height:42px;font-family:inherit;font-size:14px;font-weight:700;color:#1A2150;padding:0 4px}
#menuBox .mRow button.on{background:#1A2150;color:#fff;border-color:#1A2150}
#toc .sheet .ic{stroke:currentColor}
.qRow{margin:2px 0 4px}
.btn.qBtn{min-height:44px;padding:8px 14px}
.btn.qBtn{width:100%;background:transparent;border:1.5px dashed var(--gold2);color:var(--gold2)}

/* 수레바퀴 */
svg.wheel .wlab{cursor:pointer}
svg.wheel .wlab rect{fill:#fff;transition:fill .3s}
svg.wheel .wlab:not(.hub) text{fill:#1A2150}
svg.wheel .wlab.on rect{fill:#E2C46A;stroke:#1A2150;stroke-width:1.5}
svg.wheel .hub.on circle{stroke:#fff}
svg.wheel .whRot{transform-origin:160px 160px}
.wlist{display:grid;gap:8px;margin:6px 0 14px}
.wrow{background:var(--navy2,#161E44);border:1px solid rgba(255,255,255,.07);border-left:3px solid rgba(226,196,106,.45);border-radius:12px;padding:10px 13px;cursor:pointer;transition:border-color .3s,background .3s}
.wrow.on{border-left-color:var(--gold2,#E2C46A);background:rgba(226,196,106,.08)}
.wrow .wh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.wrow .wh b{color:var(--gold2,#E2C46A);font-size:.95em}
.wrow .wh span{font-size:.82em;opacity:.8}
.wrow .wv{font-family:"Noto Serif KR","Noto Serif SC",serif;font-size:.9em;line-height:1.7;margin-top:4px;color:#F4F0E6}
.wrow .wr{font-size:.75em;margin-top:3px;color:var(--gold2,#E2C46A);font-weight:700}
.wtabs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:2px 0 8px}
.wtab{font:inherit;font-size:.8em;padding:5px 9px;border-radius:999px;border:1px solid rgba(226,196,106,.45);background:transparent;color:#F4F0E6;cursor:pointer}
.wtab.on{background:var(--gold2,#E2C46A);color:#141A3C;border-color:transparent;font-weight:700}
#wdet{min-height:150px;cursor:default}
.langRow{flex-wrap:wrap}.langRow button{flex:1 1 28%}
#menuBox .mLang{flex-wrap:wrap}#menuBox .mLang button{flex:1 1 26%}
body[data-lang=ru] .effBtns .btn{font-size:.82em;word-break:normal;overflow-wrap:normal;padding-left:4px;padding-right:4px}
</style>

 {k:'religion',label:'Religion',len:76,msg:'Religious rituals and zeal cannot reach God. Even a way that seems right to us is not enough — salvation is found only in the name of Jesus.',vs:[['Acts 4:12','Salvation is found in no one else, for <b>there is no other name under heaven given to mankind by which we must be saved.</b>'],['Proverbs 14:12','There is a way that appears to be right, but <b>in the end it leads to death.</b>']]},

 {k:'success',label:'Success',len:72,msg:'Even if we succeed and gain everything in this world, it is worth nothing if we lose our soul.',vs:[['Mark 8:36','<b>What good is it for someone to gain the whole world, yet forfeit their soul?</b>']]}

ko:`저는 예수님을 믿는 집안에서 태어나, 어려서부터 착한 모범생이라는 칭찬을 들으며 자랐습니다. 그래서 저는 하나님 앞에서도 당연히 괜찮은 사람이라고 생각했습니다.

대학에 들어가 네비게이토의 한 형제가 이 다리 그림으로 복음을 전해 주었습니다. "의인은 없나니 하나도 없으며"(롬 3:10), "우리는 다 양 같아서 그릇 행하여 각기 제 길로 갔거늘"(사 53:6). 이 말씀 앞에서 저도 하나님을 떠나 제 길로 가던 죄인이라는 것을 처음으로 깨달았습니다. 착하게 사는 것이 저를 하나님께 데려다주는 다리가 아니었습니다.

1983년 12월 30일, 한양대 전철역에서 저는 예수님을 저의 구주로 영접했습니다. 그날 이후 지금까지 예수님은 제 삶의 중심이십니다.

이것은 제 한 사람의 이야기이고, 당신의 경험은 저와 다를 수 있습니다. 그러나 같은 다리가 지금 당신 앞에도 놓여 있습니다.`,
en:`I was born into a Christian family, and from childhood I was praised as a good, model student. So I assumed that I was naturally fine before God as well.

When I entered university, a brother from The Navigators shared the gospel with me using this bridge illustration. "There is no one righteous, not even one" (Romans 3:10). "We all, like sheep, have gone astray, each of us has turned to our own way" (Isaiah 53:6). Through these words I realized for the first time that I, too, was a sinner who had left God and gone my own way. Being good was not the bridge that could bring me to God.

On December 30, 1983, at Hanyang University subway station, I received Jesus as my Savior. From that day until now, Jesus has been the center of my life.

This is just one person's story, and your experience may be different from mine. But the same bridge is now set before you.`,
zh:`我出生在一个信耶稣的家庭，从小就被称赞是个乖巧的模范学生。所以我理所当然地以为，自己在神面前也是个不错的人。

上大学后，导航会的一位弟兄用这幅"桥"的图画向我传福音。"没有义人，连一个也没有"（罗马书 3:10），"我们都如羊走迷，各人偏行己路"（以赛亚书 53:6）。在这些经文面前，我第一次认识到，我也是一个离开神、偏行己路的罪人。做个好人，并不是能把我带到神面前的那座桥。

1983年12月30日，在汉阳大学地铁站，我接待耶稣作我的救主。从那天到现在，耶稣一直是我生命的中心。

这只是我一个人的故事，你的经历可能和我不同。但是，同一座桥现在也摆在你的面前。`,
ru:`Я родился в христианской семье, и с детства меня хвалили как хорошего, примерного ученика. Поэтому я считал, что и перед Богом я, конечно же, в порядке.

Когда я поступил в университет, брат из «Навигаторов» рассказал мне Евангелие с помощью этой картинки моста. «Нет праведного ни одного» (Римлянам 3:10). «Все мы блуждали, как овцы, совратились каждый на свою дорогу» (Исаия 53:6). Через эти слова я впервые понял, что и я — грешник, который оставил Бога и пошел своей дорогой. Быть хорошим — это не тот мост, который мог привести меня к Богу.

30 декабря 1983 года на станции метро «Университет Ханъян» я принял Иисуса как своего Спасителя. С того дня и до сих пор Иисус — центр моей жизни.

function wheelSet(deg,anim){ const sv=panel.querySelector('svg.wheel'); if(!sv)return; wDeg=deg;

function wheelTo(k,noScroll){
  let target;
  if(k in WPOS){ target=-WPOS[k]; let d=((target-wDeg)%360+540)%360-180; target=wDeg+d; if(Math.abs(d)<1) target=wDeg+360; }

  panel.querySelectorAll('.wtab').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  panel.querySelectorAll('svg.wheel .wlab').forEach(g=>g.classList.toggle('on',g.dataset.k===k));
}

${V('베드로전서 3:18','그리스도께서도 단번에 죄를 위하여 죽으사 <b>의인으로서 불의한 자를 대신하셨으니</b> 이는 우리를 하나님 앞으로 인도하려 하심이라','green')}
${Q('왜 예수님이 죽으셔야 했나요?','죄의 삯은 사망이기에 누군가는 그 값을 치러야 했습니다. 죄 없으신 예수님만이 남의 죄를 대신 질 수 있었습니다. 십자가는 하나님의 공의(죄는 반드시 값을 치름)와 사랑(그 값을 하나님이 스스로 치르심)이 함께 드러난 자리입니다.')}
${N('· "대신(代身)"을 강조하세요: 내가 받을 사망을 예수님이 대신 받으셨습니다.<br>· 롬 5:8 — 우리가 착해진 다음이 아니라 "아직 죄인 되었을 때".')}`},
risen:{t:'다시 살아나신 예수님',cap:'예수님은 다시 살아나셨습니다',html:`
<div class="stepNo">6 · 부활</div>
<h2>예수님은 죽으셨고,<br>다시 살아나셨습니다</h2>
<p class="solo">십자가로 이야기가 끝나지 않습니다. 예수님은 사흘 만에 <b>다시 살아나셨습니다.</b> 복음은 과거의 희생을 기억하라는 말에 그치지 않고, <b>지금 살아 계신 예수님을 신뢰하며</b> 새로운 삶을 시작하라는 초대입니다.</p>
<div class="btns"><button class="btn small ghost" onclick="replayRise()">▶ 다시 보기</button></div>
${V('고린도전서 15:3-4','그리스도께서 성경대로 <b>우리 죄를 위하여 죽으시고</b> 장사 지낸 바 되셨다가 성경대로 <b>사흘 만에 다시 살아나사</b>','green')}
${V('요한복음 14:6','예수께서 이르시되 <b>내가 곧 길이요</b> 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라','green')}
${Q('부활이 왜 그렇게 중요한가요?','부활은 예수님의 십자가가 실제로 죄와 죽음을 이겼다는 하나님의 확증입니다. 그리고 우리가 믿는 분이 기념비 속 인물이 아니라 지금 살아서 나와 관계를 맺으실 수 있는 분이라는 뜻입니다. 그래서 믿음은 "사실 인정"을 넘어 "살아 계신 분을 신뢰함"이 됩니다.')}
${N('· 다리는 무너지지 않았습니다 — 부활이 다리를 영원히 붙들고 있습니다.<br>· 고전 15:3-4는 바울이 "가장 먼저 전한 것"이라고 한 복음의 요약입니다.')}`},
gift:{t:'하나님의 선물',cap:'영생은 값없이 주시는 하나님의 선물',html:`
<div class="stepNo">7 · 하나님의 선물</div>
<h2>구원은 보상이 아니라<br>선물입니다</h2>
<p class="solo">선물은 일해서 버는 것이 아니라 <b>값없이 받는 것</b>입니다. 그림의 하나님 편에 무엇이 준비되어 있는지 보세요.</p>
<div class="btns"><button class="btn gold" onclick="openGift()">🎁 다시 보기</button></div>
${V('로마서 6:23','죄의 삯은 사망이요 <b>하나님의 은사는</b> 그리스도 예수 우리 주 안에 있는 <b>영생</b>이니라','green')}
<div class="cmp"><div class="a"><strong>죄의 삯</strong>내가 일한 대가<br>→ 마땅히 받는 것<br>→ <b>사망</b></div><div class="b"><strong>하나님의 은사</strong>값없이 주시는 선물<br>→ 받기만 하면 됨<br>→ <b>영생</b></div></div>
<div class="bubble"><b>영생이란?</b> 단지 끝없이 오래 사는 것이 아닙니다. <b>하나님을 알고 그분과 함께 살아가는 생명</b>이며, 지금 시작되어 죽음 너머까지 이어지는 관계입니다.</div>
${V('요한복음 17:3','<b>영생은 곧</b> 유일하신 참 하나님과 그가 보내신 자 예수 그리스도를 <b>아는 것이니이다</b>','green')}
${V('에베소서 2:8-9','너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 <b>하나님의 선물이라</b> 행위에서 난 것이 아니니 이는 누구든지 자랑하지 못하게 함이라','green')}
${Q('공짜라면 너무 쉬운 것 아닌가요?','받는 사람에게는 값없지만, 주시는 하나님께는 가장 비싼 값—아들의 생명—이 치러진 선물입니다. 쉬워서가 아니라, 우리가 결코 갚을 수 없기에 선물로 주신 것입니다.')}
${N('· 실제로 볼펜 같은 물건을 내밀며 "선물입니다" 해 보세요. 받으려면? → 손을 내밀어 받기만. 돈을 내면 더 이상 선물이 아닙니다.<br>· 롬 6:23 한 구절 전도: "죄", "선물", "영생"이라는 말을 각각 어떻게 생각하는지 물어보세요.')}`},
story:{t:'저의 이야기',cap:'저도 이 그림으로 예수님을 만났습니다',html:`
<div class="stepNo">전하는 이의 이야기</div>
<h2>저도 이 이야기를 듣고<br>예수님을 믿게 되었습니다</h2>
<div id="testi"></div>
${N('· 전하는 분은 ✏️ 단추로 자신의 간증을 넣을 수 있습니다: ① 예전에 하나님을 어떻게 생각했는지 ② 다리 예화에서 무엇을 깨달았는지 ③ 예수님을 믿는 것이 지금 내게 어떤 의미인지.<br>· "저처럼 느껴야 믿은 것"이라는 인상을 주지 않도록.')}`},
respond:{t:'나의 응답',cap:'당신은 지금 어느 편에 계십니까?',html:`
<div class="stepNo">8 · 나의 응답</div>
<h2>다리가 놓였습니다.<br>이제 건너가는 일이 남았습니다</h2>
<p class="solo">예수님을 믿는다는 것은 이렇게 말할 수 있습니다.</p>
<div class="cmp"><div class="a" style="background:#f3ece0"><strong>🔄 회개</strong>내가 주인 되어 가던 길에서 돌아서는 것</div><div class="b"><strong>🤝 믿음</strong>살아 계신 예수님께 나를 맡기는 것</div></div>
${V('사도행전 20:21','유대인과 헬라인들에게 <b>하나님께 대한 회개</b>와 <b>우리 주 예수 그리스도께 대한 믿음</b>을 증언한 것이라','green')}
${V('요한복음 1:12','<b>영접하는 자</b> 곧 그 이름을 믿는 자들에게는 <b>하나님의 자녀가 되는 권세</b>를 주셨으니','green')}
${V('요한계시록 3:20','볼지어다 내가 <b>문 밖에 서서 두드리노니</b> 누구든지 내 음성을 듣고 <b>문을 열면</b> 내가 그에게로 들어가 그와 더불어 먹고 그는 나와 더불어 먹으리라','green')}
${Q('믿는다는 것은 사실이라고 인정하는 것인가요?','인정하는 것에서 시작하지만 거기서 멈추지 않습니다. 의자가 튼튼하다는 것을 아는 것만으로는 쉴 수 없고, 실제로 앉아 몸을 맡겨야 합니다. 믿음은 예수님이 나를 위해 죽고 살아나셨다는 사실 위에 <b>나 자신을 맡기는 것</b>입니다.')}
<div class="bubble">그림 속에서 당신은 지금 어디에 계신가요? 마음에 가까운 것을 골라 보세요.</div>
<div class="btns" style="flex-direction:column">
 <button class="btn gold" onclick="go(idx('pray'),1)">🙏 하나님께 기도하고 싶어요</button>
 <button class="btn ghost" onclick="moreFaith()">📖 예수님을 믿는다는 뜻을 더 알고 싶어요</button>
 <button class="btn ghost" onclick="go(idx('faq'),1)">❓ 아직 질문이 있어요</button>
 <button class="btn ghost" onclick="pause()">🌙 오늘은 여기까지 살펴볼게요</button>
 <button class="btn ghost" style="border-style:dashed" onclick="go(idx('assure'),1)">😊 이미 예수님을 믿고 있어요</button>
</div>
<div id="whereBox"></div>
${N('· 그림의 사람을 가리키며 물어보세요. 강요하지 말고 기다려 주세요. 침묵도 괜찮습니다.<br>· 어떤 선택이든 존중하고, 다시 만날 약속이나 연락처를 남기세요.')}`},
pray:{t:'기도',cap:'믿음으로 다리를 건너갑니다',html:`
<div class="stepNo">9 · 기도</div>
<h2>마음을 하나님께<br>말씀드려 보세요</h2>
<p style="font-size:.88em;color:var(--sub)">이 문장을 그대로 읽는 행위 자체가 구원을 주는 것은 아닙니다. 중요한 것은 예수님을 신뢰하며 하나님께 진실하게 나아가는 것입니다. 아래 기도는 마음을 표현하도록 돕는 <b>예시</b>입니다.</p>
<div class="prayer">하나님,<br>저는 하나님을 떠나 제 뜻대로 살아온 죄인입니다. 용서해 주세요.<br>예수님께서 저의 죄를 위해 십자가에서 죽으시고 다시 살아나신 것을 믿습니다.<br>이제 제 길에서 돌아서서, 예수님을 저의 <b>구주와 주님으로 영접</b>합니다.<br>영생을 선물로 주셔서 감사합니다.<br>예수님의 이름으로 기도합니다. <b>아멘.</b></div>
<div class="btns"><button class="btn gold" id="amenBtn" onclick="amen()">🙏 진심으로 이 기도를 드렸습니다</button></div>
<div id="amenBox"></div>
${Q('회개하면 완벽한 사람이 되어야 하나요?','아닙니다. 회개는 완벽해지겠다는 약속이 아니라 <b>방향을 바꾸는 것</b>입니다. 넘어질 때도 있지만, 하나님의 자녀는 다시 하나님께 돌아와 용서받고 자라 갑니다(요일 1:9).')}
${N('· 전하는 이가 한 구절씩 먼저 읽고 따라 하게 하면 좋습니다.<br>· 기도 후 바로 확신의 말씀으로 넘어가세요. 감정이 아니라 약속에 근거합니다.')}`},
assure:{t:'확신',cap:'사망에서 생명으로 옮겼습니다',html:`
<div class="stepNo">10 · 확신</div>
<h2>영생은 지금 이미<br>내 것입니다</h2>
<p>빈칸을 눌러 하나님의 약속을 확인해 보세요.</p>
<div class="verse green"><div class="ref">요한복음 5:24</div><div class="tx">내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 ${B('얻었고')} 심판에 ${B('이르지 아니하나니')} 사망에서 생명으로 ${B('옮겼느니라')}</div></div>
<div id="blankMsg"></div>
${V('요한일서 5:11-13','또 증거는 이것이니 하나님이 우리에게 영생을 주신 것과 이 생명이 그의 아들 안에 있는 그것이니라 <b>아들이 있는 자에게는 생명이 있고</b> 하나님의 아들이 없는 자에게는 생명이 없느니라 내가 하나님의 아들의 이름을 믿는 너희에게 이것을 쓰는 것은 너희로 하여금 <b>너희에게 영생이 있음을 알게</b> 하려 함이라','green')}
<p class="solo" style="font-size:.9em;color:var(--sub)">확신은 기분이 아니라 <b>하나님의 말씀</b> 위에 서 있습니다.</p>
${TRAIN('사실','하나님의 말씀','믿음','말씀을 신뢰','감정','따라오는 것')}
${Q('아직 확신이 없어도 괜찮을까요?','괜찮습니다. 확신은 하루아침에 완성되지 않고 말씀을 읽으며 자랍니다. 질문이 남아 있다면 언제든 묻고, 요한복음을 하루 한 장씩 읽어 보세요. 하나님은 정직하게 찾는 사람을 만나 주십니다.')}
${N('· 시제에 주목: "얻을 것이다"가 아니라 "얻었고", "옮겼느니라" — 이미 이루어진 사실.<br>· 기차 예화: 기관차(사실)가 끌고 석탄차(믿음)가 연료를 대고 객차(감정)는 따라옵니다.')}`},
next:{t:'그다음 걸음',cap:'하나님 편에서 시작되는 새 삶',html:`
<div class="stepNo">11 · 그다음</div>
<h2>새 생명이 자라가려면</h2>
<p class="solo">갓 태어난 아기가 먹고 숨 쉬고 가족 안에서 자라듯, 그리스도인도 <b>네 가지</b>로 자라갑니다.</p>
${WHEEL('말씀','기도','교제','증거','그리스도','중심','순종하는 그리스도인의 삶')}
${WLIST([
['c','중심 · 그리스도','삶의 주인이 바뀐 새사람','고린도후서 5:17','그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새 것이 되었도다','갈라디아서 2:20'],
['w','말씀','요한복음을 하루 한 장씩','디모데후서 3:16','모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니','여호수아 1:8'],
['p','기도','하나님께 무엇이든 말씀드리기','요한복음 15:7','너희가 내 안에 거하고 내 말이 너희 안에 거하면 무엇이든지 원하는 대로 구하라 그리하면 이루리라','빌립보서 4:6-7'],
['f','교제','복음을 전해 준 사람, 교회와 함께','마태복음 18:20','두세 사람이 내 이름으로 모인 곳에는 나도 그들 중에 있느니라','히브리서 10:24-25'],
['e','증거','받은 선물을 다른 이에게','마태복음 4:19','나를 따라오라 내가 너희를 사람을 낚는 어부가 되게 하리라','로마서 1:16'],
['rim','테 · 순종','삶의 현장에서 말씀대로 사는 것','로마서 12:1','그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니 너희 몸을 하나님이 기뻐하시는 거룩한 산 제물로 드리라 이는 너희가 드릴 영적 예배니라','요한복음 14:21']
])}
${BDAY('🎂 나의 영적 생일','이름','영적 생일 카드 만들기')}
${N('· 수레바퀴: 힘은 중심(그리스도)에서 나옵니다. 세로 살(말씀·기도)은 하나님과, 가로 살(교제·증거)은 사람과의 관계.<br>· 일주일 안에 다시 만날 약속을 정하고, 요한복음을 함께 읽으며 양육을 시작하세요.')}`},
summary:{t:'한눈에 보기',cap:'하나님의 선물 영생 — 다리 예화',html:`
<div class="stepNo">정리</div>
<h2>한눈에 보는 복음</h2>
<div class="verse"><div class="tx" style="font-size:.95em;line-height:1.9">
① <b>하나님의 뜻</b> — 요 3:16, 요 10:10<br>② <b>우리의 현실 · 죄</b> — 롬 3:23, 사 53:6, 사 59:2<br>③ <b>죄의 결과</b> — 롬 6:23 앞, 히 9:27<br>④ <b>우리의 한계</b> — 엡 2:8-9<br>⑤ <b>십자가</b> — 롬 5:8, 벧전 3:18<br>⑥ <b>부활</b> — 고전 15:3-4, 요 14:6<br>⑦ <b>선물인 영생</b> — 롬 6:23, 요 17:3<br>⑧ <b>나의 응답</b> — 행 20:21, 요 1:12, 계 3:20<br>⑨ <b>확신</b> — 요 5:24, 요일 5:11-13</div></div>
<div class="btns"><button class="btn" onclick="go(0)">처음부터 다시</button><button class="btn ghost" onclick="share()">🔗 이 앱 보내기</button></div>
${N('· 종이에 이 그림을 직접 그리며 다시 설명하고, 그 종이를 선물로 드리세요.<br>· 이해 확인 질문: "인간의 문제는 무엇이라고 했나요?" "예수님은 무엇을 하셨다고 이해하셨나요?" "믿는다는 것은 무엇이라고 느끼셨나요?" "이해되지 않는 표현은 어디였나요?"')}`},
faq:{t:'자주 묻는 질문',cap:'궁금한 것은 언제든 물어보세요',html:`
<div class="stepNo">질문</div>
<h2>아직 질문이 있으신가요?</h2>
<p>질문하는 것은 믿음의 반대가 아닙니다. 궁금한 질문을 눌러 보세요.</p>
<div id="faqAll"></div>
<div class="bubble">여기 없는 질문은 이 앱을 전해 준 분께 직접 물어보세요. 기쁘게 함께 이야기할 것입니다.</div>
<div class="btns"><button class="btn ghost" onclick="go(idx('respond'),-1)">◀ 나의 응답으로</button></div>`}
}),

/* ------------------------------ English (NIV) ------------------------------ */
en:()=>({
start:{t:'Start',cap:'',html:`
<div class="stepNo">THE GIFT OF GOD</div>
<h2>Between God and me —<br>what way has Jesus opened?</h2>
<p>Explore the heart of the Christian message through <b>pictures and short explanations</b>. It takes about 10 minutes, and you can stop and ask questions at any time.</p>
<div class="btns qRow"><button class="btn qBtn" onclick="setShort(true,0)">${QS.en.btn}<br><span style="font-weight:400;font-size:.8em">${QS.en.sub}</span></button></div>
<div class="btns" style="flex-direction:column">
 <button class="btn" onclick="setMode('together',true)">👥 Look together<br><span style="font-weight:400;font-size:.8em">with the person sharing it with you</span></button>
 <button class="btn ghost" onclick="setMode('alone',true)">🙋 On my own<br><span style="font-weight:400;font-size:.8em">read and listen at my own pace</span></button>
</div>${LANGBTNS}
${N('· "Together" shows less text and a bigger picture. Keep these notes (📝) on for the helper only.<br>· A question to open the conversation: "If your life ended tonight, are you sure you would go to heaven?" "On what basis?"<br>· Ask permission: "May I show you, with one simple picture, how the Bible answers that question?"')}`},
love:{t:"God's Purpose",cap:'In the beginning, God and people were together',html:`
<div class="stepNo">1 · GOD'S PURPOSE</div>
<h2>God loves us and made us<br>to live with him</h2>
<p class="solo">The Bible says God created people in his own image and wanted them to live in a <b>close relationship</b> with him. As the picture shows, at first there was no gap between God and people.</p>
<p class="solo">So why do we feel far from God, and hurt one another as we live?</p>
${V('John 3:16','For God <b>so loved the world</b> that he gave his one and only Son, that whoever believes in him shall not perish but <b>have eternal life.</b>')}
${V('John 10:10','I have come that they may have life, and have it <b>to the full.</b>')}
${Q('I am not sure God even exists.','That is okay. This app will not force you to believe. Listen to what the Bible says about God and people all the way through, and then judge for yourself. Questions are always welcome.')}
${N('· Have the listener read John 3:16 with their own name in place of "the world".<br>· Ask: "How do you feel when you hear that God loves you?"<br>· So why do so many people not experience this love? → Next')}`},
sin:{t:'Our Problem — Sin',cap:'Sin has separated people from God',html:`
<div class="stepNo">2 · OUR PROBLEM</div>
<h2>Sin has separated us<br>from God</h2>
<p class="solo">In the Bible, sin is not only bad behavior. It is <b>the attitude of not trusting God and living as the master of my own life without him</b> — and the actions that come from it.</p>
<div class="btns"><button class="btn small ghost" onclick="replayCrack()">▶ Replay</button></div>
${V('Romans 3:23','for <b>all have sinned</b> and fall short of the glory of God','red')}
${V('Isaiah 53:6','We all, like sheep, have gone astray, <b>each of us has turned to our own way;</b> and the LORD has laid on him the iniquity of us all.','red')}
${V('Isaiah 59:2','But your iniquities <b>have separated you from your God;</b> your sins have hidden his face from you, so that he will not hear.','red')}
${Q('I try to be a good person. Am I still a sinner?','Sin in the Bible is not about how big a crime is, but about <b>direction</b>. Even if I live a good life, if I am the master and go "my own way" without God, my relationship with him is broken. In archery, missing by 1 cm or by 1 m is still missing the target. The Bible\'s word for sin carries exactly this meaning: "missing the mark."')}
${N('· Ask whether "all" in Romans 3:23 includes them: "Does this include you? It includes me too."<br>· Speak in the tone of "I was like that too," not condemnation.')}`},
death:{t:'The Result of Sin',cap:'The wages of sin is death, then judgment',html:`
<div class="stepNo">3 · THE RESULT</div>
<h2>The result of sin is<br>death and judgment</h2>
<p class="solo">The Bible says the wages of sin is <b>death</b> — not only physical death, but eternal separation from God, the source of life.</p>
<p class="solo">The separation sin causes is not a valley joined at the bottom, but <b>a bottomless chasm.</b></p>
${V('Romans 6:23a','For <b>the wages of sin is death</b>','red')}
${V('Hebrews 9:27','Just as people are destined to die once, and <b>after that to face judgment</b>','red')}
${Q('If God is love, why does he judge?','Love and justice are not opposites. A judge who simply ignores wrongdoing is not a good judge. Because God is holy, he judges sin; and because he is love, he prepared a way for that judgment to be taken by someone else. That is what comes next.')}
${N('· Ask: "What are wages?" → what you earn for your work.<br>· State the facts calmly rather than trying to frighten.<br>· "How do people try to cross this chasm?" → Next')}`},
effort:{t:'Our Limits',cap:'No effort can reach God',html:`
<div class="stepNo">4 · OUR LIMITS</div>
<h2>We cannot cross by<br>our own efforts</h2>
<p>People build many bridges to try to cross this chasm. Tap a button and <b>try it yourself.</b></p>
<div class="btns effBtns">${UI[st.lang].eff.map((e,i)=>`<button class="btn ghost" onclick="tryPlank(this,${i})">${e.label}</button>`).join('')}</div>
<div id="effortMsg"></div>
${Q('Does this mean living a good life is meaningless?','No. Doing good is valuable, and God is pleased with it. It simply means we cannot <b>buy salvation</b> with good works. The order is reversed: we do not reach God by doing good; rather, those saved by God\'s grace live out good works in gratitude (Ephesians 2:10).')}
${N('· Let the listener tap the buttons. Each time one falls: "Will this work?"<br>· Ask: "What have you relied on to cross this chasm?"<br>· Be sure to cover the question above so that good works are not seen as bad.')}`},
cross:{t:'The Cross of Jesus',cap:'God opened the way first',html:`
<div class="stepNo">5 · THE CROSS</div>
<h2>God himself opened<br>the way of salvation</h2>
<p class="solo">Because we could not go to God, <b>God came to us.</b> Jesus took the penalty for our sin in our place and died on the cross.</p>
<div class="btns"><button class="btn small ghost" onclick="replayCross()">▶ Replay</button></div>
${V('Romans 5:8','But God demonstrates his own love for us in this: <b>While we were still sinners,</b> Christ died for us.','green')}
${V('1 Peter 3:18','For Christ also suffered once for sins, <b>the righteous for the unrighteous,</b> to bring you to God.','green')}
${Q('Why did Jesus have to die?','Because the wages of sin is death, someone had to pay that price. Only Jesus, who had no sin, could carry the sins of others. The cross is where God\'s justice (sin must be paid for) and his love (God pays it himself) are shown together.')}
${N('· Emphasize "in our place": Jesus received the death I deserved.<br>· Romans 5:8 — not after we became good, but "while we were still sinners".')}`},
risen:{t:'The Risen Jesus',cap:'Jesus rose again',html:`
<div class="stepNo">6 · THE RESURRECTION</div>
<h2>Jesus died,<br>and he rose again</h2>
<p class="solo">The story does not end at the cross. On the third day Jesus <b>rose from the dead.</b> The gospel is not just a call to remember a past sacrifice — it is an invitation to <b>trust the living Jesus</b> and begin a new life.</p>
<div class="btns"><button class="btn small ghost" onclick="replayRise()">▶ Replay</button></div>
${V('1 Corinthians 15:3-4','that Christ <b>died for our sins</b> according to the Scriptures, that he was buried, that he was <b>raised on the third day</b> according to the Scriptures','green')}
${V('John 14:6','Jesus answered, "<b>I am the way</b> and the truth and the life. No one comes to the Father except through me."','green')}
${Q('Why is the resurrection so important?','The resurrection is God\'s proof that the cross truly defeated sin and death. It also means the one we believe in is not a figure in a monument, but someone alive today who can have a relationship with me. So faith becomes more than "accepting a fact" — it is "trusting a living person".')}
${N('· The bridge did not collapse — the resurrection holds it firm forever.<br>· 1 Cor 15:3-4 is what Paul called the gospel he passed on "as of first importance".')}`},
gift:{t:'The Gift of God',cap:'Eternal life is God\'s free gift',html:`
<div class="stepNo">7 · THE GIFT</div>
<h2>Salvation is not a reward,<br>but a gift</h2>
<p class="solo">A gift is not earned by work; it is <b>received freely.</b> See what God has prepared on his side of the picture.</p>
<div class="btns"><button class="btn gold" onclick="openGift()">🎁 Show again</button></div>
${V('Romans 6:23','For the wages of sin is death, but <b>the gift of God</b> is <b>eternal life</b> in Christ Jesus our Lord.','green')}
<div class="cmp"><div class="a"><strong>Wages of sin</strong>what I earned<br>→ what I deserve<br>→ <b>death</b></div><div class="b"><strong>Gift of God</strong>given freely<br>→ simply receive it<br>→ <b>eternal life</b></div></div>
<div class="bubble"><b>What is eternal life?</b> It is not just living forever. It is <b>a life of knowing God and living with him</b> — a relationship that begins now and continues beyond death.</div>
${V('John 17:3','<b>Now this is eternal life:</b> that they <b>know</b> you, the only true God, and Jesus Christ, whom you have sent.','green')}
${V('Ephesians 2:8-9','For it is by grace you have been saved, through faith — and this is not from yourselves, <b>it is the gift of God</b> — not by works, so that no one can boast.','green')}
${Q('If it is free, isn\'t that too easy?','It is free to the one who receives it, but God paid the highest price — the life of his Son. He gives it as a gift not because it is cheap, but because we could never repay it.')}
${N('· Hold out a pen and say "This is a gift for you." How do you get it? → Just reach out and take it. If you pay, it is no longer a gift.<br>· One-verse method (Romans 6:23): ask what they think of the words "sin", "gift" and "eternal life".')}`},
story:{t:'My Story',cap:'I too met Jesus through this picture',html:`
<div class="stepNo">THE SHARER'S STORY</div>
<h2>I too heard this message<br>and came to believe in Jesus</h2>
<div id="testi"></div>
${N('· With the ✏️ button you can put in your own testimony: ① how you used to think about God ② what you understood through the bridge ③ what believing in Jesus means to you now.<br>· Avoid giving the impression that one must feel exactly as you did.')}`},
respond:{t:'My Response',cap:'Which side are you on now?',html:`
<div class="stepNo">8 · MY RESPONSE</div>
<h2>The bridge is in place.<br>Now it is time to cross</h2>
<p class="solo">Believing in Jesus can be described like this:</p>
<div class="cmp"><div class="a" style="background:#f3ece0"><strong>🔄 Repent</strong>turn from the way where I was my own master</div><div class="b"><strong>🤝 Believe</strong>entrust myself to the living Jesus</div></div>
${V('Acts 20:21','I have declared to both Jews and Greeks that they must <b>turn to God in repentance</b> and <b>have faith in our Lord Jesus.</b>','green')}
${V('John 1:12','Yet <b>to all who did receive him,</b> to those who believed in his name, he gave <b>the right to become children of God</b>','green')}
${V('Revelation 3:20','Here I am! <b>I stand at the door and knock.</b> If anyone hears my voice and <b>opens the door,</b> I will come in and eat with that person, and they with me.','green')}
${Q('Does believing mean agreeing that it is true?','It starts with agreeing, but does not stop there. Knowing a chair is strong will not let you rest; you have to actually sit down and put your weight on it. Faith is <b>entrusting myself</b> to the fact that Jesus died and rose again for me.')}
<div class="bubble">Where are you in the picture right now? Choose what is closest to your heart.</div>
<div class="btns" style="flex-direction:column">
 <button class="btn gold" onclick="go(idx('pray'),1)">🙏 I want to pray to God</button>
 <button class="btn ghost" onclick="moreFaith()">📖 I want to know more about believing in Jesus</button>
 <button class="btn ghost" onclick="go(idx('faq'),1)">❓ I still have questions</button>
 <button class="btn ghost" onclick="pause()">🌙 That's enough for today</button>
 <button class="btn ghost" style="border-style:dashed" onclick="go(idx('assure'),1)">😊 I already believe in Jesus</button>
</div>
<div id="whereBox"></div>
${N('· Point to the person in the picture and ask. Do not pressure; wait. Silence is okay.<br>· Respect any choice, and arrange to meet again or exchange contacts.')}`},
pray:{t:'Prayer',cap:'Crossing the bridge by faith',html:`
<div class="stepNo">9 · PRAYER</div>
<h2>Tell God<br>what is in your heart</h2>
<p style="font-size:.88em;color:var(--sub)">Reading these words is not in itself what saves you. What matters is coming to God honestly, trusting in Jesus. The prayer below is an <b>example</b> to help you express your heart.</p>
<div class="prayer">God,<br>I am a sinner who has left you and lived my own way. Please forgive me.<br>I believe that Jesus died on the cross for my sins and rose again.<br>Now I turn from my own way and <b>receive Jesus as my Savior and Lord.</b><br>Thank you for the gift of eternal life.<br>In Jesus' name I pray. <b>Amen.</b></div>
<div class="btns"><button class="btn gold" id="amenBtn" onclick="amen()">🙏 I sincerely prayed this prayer</button></div>
<div id="amenBox"></div>
${Q('If I repent, do I have to become perfect?','No. Repentance is not a promise to become perfect; it is <b>a change of direction.</b> We will still stumble, but God\'s children come back to him, are forgiven, and keep growing (1 John 1:9).')}
${N('· It helps to read each line first and let them repeat it.<br>· After praying, move straight to the assurance verses — based on God\'s promise, not feelings.')}`},
assure:{t:'Assurance',cap:'Crossed over from death to life',html:`
<div class="stepNo">10 · ASSURANCE</div>
<h2>Eternal life is<br>already mine</h2>
<p>Tap the blanks to see God's promise.</p>
<div class="verse green"><div class="ref">John 5:24</div><div class="tx">Very truly I tell you, whoever hears my word and believes him who sent me ${B('has eternal life')} and ${B('will not be judged')} but ${B('has crossed over')} from death to life.</div></div>
<div id="blankMsg"></div>
${V('1 John 5:11-13','And this is the testimony: God has given us eternal life, and this life is in his Son. <b>Whoever has the Son has life;</b> whoever does not have the Son of God does not have life. I write these things to you who believe in the name of the Son of God <b>so that you may know that you have eternal life.</b>','green')}
<p class="solo" style="font-size:.9em;color:var(--sub)">Assurance stands not on feelings but on <b>God's word.</b></p>
${TRAIN('Fact',"God's word",'Faith','trusting the word','Feeling','follows along')}
${Q('Is it okay if I am not yet sure?','Yes. Assurance does not come all at once; it grows as you read God\'s word. If you still have questions, ask any time, and read one chapter of John each day. God meets those who honestly seek him.')}
${N('· Note the tense: not "will have" but "has eternal life", "has crossed over" — already done.<br>· Train illustration: the engine (fact) pulls, the coal car (faith) fuels, the caboose (feeling) follows.')}`},
next:{t:'Next Steps',cap:'A new life begins on God\'s side',html:`
<div class="stepNo">11 · NEXT STEPS</div>
<h2>How new life grows</h2>
<p class="solo">Just as a newborn baby eats, breathes and grows up in a family, a Christian grows in <b>four ways.</b></p>
${WHEEL('Word','Prayer','Fellowship','Witness','Christ','the center','THE OBEDIENT CHRISTIAN')}
${WLIST([
['c','Hub · Christ','a new person with a new Lord','2 Corinthians 5:17','Therefore, if anyone is in Christ, the new creation has come: The old has gone, the new is here!','Galatians 2:20'],
['w','Word','one chapter of John each day','2 Timothy 3:16','All Scripture is God-breathed and is useful for teaching, rebuking, correcting and training in righteousness','Joshua 1:8'],
['p','Prayer','talk to God about anything','John 15:7','If you remain in me and my words remain in you, ask whatever you wish, and it will be done for you.','Philippians 4:6-7'],
['f','Fellowship','with the one who shared this, and a church','Matthew 18:20','For where two or three gather in my name, there am I with them.','Hebrews 10:24-25'],
['e','Witness','pass the gift on to others','Matthew 4:19','“Come, follow me,” Jesus said, “and I will send you out to fish for people.”','Romans 1:16'],
['rim','Rim · Obedience','living out God’s word in daily life','Romans 12:1','Therefore, I urge you, brothers and sisters, in view of God’s mercy, to offer your bodies as a living sacrifice, holy and pleasing to God—this is your true and proper worship.','John 14:21']
])}
${BDAY('🎂 My spiritual birthday','Name','Make my birthday card')}
${N('· The Wheel: power comes from the hub (Christ). The vertical spokes (Word, Prayer) relate to God; the horizontal (Fellowship, Witness) to people.<br>· Arrange to meet within a week and begin follow-up by reading John together.')}`},
summary:{t:'Summary',cap:'The Gift of God — The Bridge to Life',html:`
<div class="stepNo">SUMMARY</div>
<h2>The gospel at a glance</h2>
<div class="verse"><div class="tx" style="font-size:.95em;line-height:1.9">
① <b>God's purpose</b> — John 3:16; 10:10<br>② <b>Our problem: sin</b> — Rom 3:23; Isa 53:6; 59:2<br>③ <b>The result</b> — Rom 6:23a; Heb 9:27<br>④ <b>Our limits</b> — Eph 2:8-9<br>⑤ <b>The cross</b> — Rom 5:8; 1 Pet 3:18<br>⑥ <b>The resurrection</b> — 1 Cor 15:3-4; John 14:6<br>⑦ <b>The gift of eternal life</b> — Rom 6:23; John 17:3<br>⑧ <b>My response</b> — Acts 20:21; John 1:12; Rev 3:20<br>⑨ <b>Assurance</b> — John 5:24; 1 John 5:11-13</div></div>
<div class="btns"><button class="btn" onclick="go(0)">Start again</button><button class="btn ghost" onclick="share()">🔗 Share this app</button></div>
<p style="font-size:.75em;color:#999">Scripture quotations taken from The Holy Bible, New International Version® NIV®. Copyright © 1973, 1978, 1984, 2011 by Biblica, Inc.™ Used by permission. All rights reserved worldwide.</p>
${N('· Draw the picture on paper as you explain it again, and give the paper as a gift.<br>· Check understanding: "What did it say our problem is?" "What did Jesus do?" "What does believing mean?" "Which words were unclear?"')}`},
faq:{t:'Questions',cap:'Ask anything, any time',html:`
<div class="stepNo">QUESTIONS</div>
<h2>Do you still have questions?</h2>
<p>Asking questions is not the opposite of faith. Tap any question.</p>
<div id="faqAll"></div>
<div class="bubble">For questions not listed here, please ask the person who shared this app with you. They will be glad to talk with you.</div>
<div class="btns"><button class="btn ghost" onclick="go(idx('respond'),-1)">◀ Back to my response</button></div>`}
}),

/* ------------------------------ 中文 (和合本) ------------------------------ */
zh:()=>({
start:{t:'开始',cap:'',html:`
<div class="stepNo">神的恩赐</div>
<h2>在神和我之间，<br>耶稣开了一条怎样的路？</h2>
<p>用<b>图画和简短的说明</b>来认识基督信仰的核心信息。大约需要10分钟，随时可以停下来提问。</p>
<div class="btns qRow"><button class="btn qBtn" onclick="setShort(true,0)">${QS.zh.btn}<br><span style="font-weight:400;font-size:.8em">${QS.zh.sub}</span></button></div>
<div class="btns" style="flex-direction:column">
 <button class="btn" onclick="setMode('together',true)">👥 一起看<br><span style="font-weight:400;font-size:.8em">和分享的人一起边看边谈</span></button>
 <button class="btn ghost" onclick="setMode('alone',true)">🙋 自己看<br><span style="font-weight:400;font-size:.8em">自己慢慢阅读和聆听</span></button>
</div>${LANGBTNS}
${N('· "一起看"会减少文字、放大图画。这些笔记（📝）只给传讲者看。<br>· 开启谈话的问题："如果今晚你的生命结束了，你确定能上天堂吗？""根据是什么？"<br>· 先征求同意："我可以用一幅简单的图，给你看看圣经怎样回答这个问题吗？"')}`},
love:{t:'神的心意',cap:'起初，神与人同在',html:`
<div class="stepNo">1 · 神的心意</div>
<h2>神爱我们，<br>造我们与他同住</h2>
<p class="solo">圣经说，神照着自己的形像造人，<b>愿意与人亲近</b>。就像图画所示，起初神与人之间没有任何隔阂。</p>
<p class="solo">那么，为什么我们却觉得神很遥远，又活在彼此伤害中呢？</p>
${V('约翰福音 3:16','<b>神爱世人，</b>甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，<b>反得永生。</b>')}
${V('约翰福音 10:10','我来了，是要叫羊得生命，并且<b>得的更丰盛。</b>')}
${Q('我不确定神是否真的存在。','没关系。这个应用不会强迫你相信。请先听完圣经怎样讲论神和人，然后自己判断。随时欢迎提问。')}
${N('· 请对方把约3:16的"世人"换成自己的名字读一遍。<br>· 问："听到神爱你，你心里有什么感受？"<br>· 那为什么很多人享受不到这份爱呢？→ 下一步')}`},
sin:{t:'人的问题——罪',cap:'罪使人与神隔绝',html:`
<div class="stepNo">2 · 人的问题</div>
<h2>罪使人与神<br>隔绝了</h2>
<p class="solo">圣经所说的罪，不只是坏行为，也包括<b>不信靠神、远离神、以自己为生命之主的心态</b>，以及由这种心态产生的行为。</p>
<div class="btns"><button class="btn small ghost" onclick="replayCrack()">▶ 重新播放</button></div>
${V('罗马书 3:23','因为<b>世人都犯了罪，</b>亏缺了神的荣耀；','red')}
${V('以赛亚书 53:6','我们都如羊走迷，<b>各人偏行己路；</b>耶和华使我们众人的罪孽都归在他身上。','red')}
${V('以赛亚书 59:2','但你们的罪孽<b>使你们与神隔绝；</b>你们的罪恶使他掩面不听你们。','red')}
${Q('我一直努力做好人，难道也是罪人吗？','圣经说的罪不在于罪行的大小，而在于<b>方向</b>。即使行善，若离开神、自己作主、"偏行己路"，与神的关系仍然是断绝的。射箭时偏一厘米或偏一米，都是没有射中靶心。圣经中"罪"这个词，正有"射不中靶心"的意思。')}
${N('· 问对方罗3:23的"世人"是否包括自己："这里也包括你吗？也包括我。"<br>· 用"我也曾经是这样"的语气，而不是定罪的语气。')}`},
death:{t:'罪的结果',cap:'罪的工价乃是死，死后且有审判',html:`
<div class="stepNo">3 · 罪的结果</div>
<h2>罪的结果是<br>死亡和审判</h2>
<p class="solo">圣经说罪的工价乃是<b>死</b>——不只是肉体的死亡，更是永远与神——生命的源头——隔绝。</p>
<p class="solo">罪所造成的隔绝，不是底下相连的山谷，而是<b>无底的深渊</b>。</p>
${V('罗马书 6:23（上）','因为<b>罪的工价乃是死；</b>','red')}
${V('希伯来书 9:27','按着定命，人人都有一死，<b>死后且有审判。</b>','red')}
${Q('神既然是爱，为什么还要审判？','爱与公义并不矛盾。若法官一味掩盖不义，就不是好法官。神是圣洁的，所以必审判罪；神又因着爱，为我们预备了救赎之路，使我们应受的审判有了代为承担的可能。接下来，我们就来了解这件事。')}
${N('· 问："工价是什么？"→ 做工所得的报酬。<br>· 平静地讲述事实，不要用恐吓的方式。<br>· "人们想用什么方法跨越这道深渊呢？"→ 下一步')}`},
effort:{t:'我们的局限',cap:'人靠自己的努力，无法来到神面前',html:`
<div class="stepNo">4 · 我们的局限</div>
<h2>靠自己的努力<br>无法跨越</h2>
<p>人们尝试架起各种各样的桥来跨越这道深渊。请点按钮，<b>亲自试一试。</b></p>
<div class="btns effBtns">${UI[st.lang].eff.map((e,i)=>`<button class="btn ghost" onclick="tryPlank(this,${i})">${e.label}</button>`).join('')}</div>
<div id="effortMsg"></div>
${Q('那么行善就没有意义了吗？','不是的。行善是宝贵的，神也喜悦。只是我们不能用行善来<b>换取救恩</b>。顺序正好相反：不是靠行善来到神面前，而是蒙神恩典得救的人，怀着感恩的心过行善的生活（以弗所书 2:10）。')}
${N('· 让对方亲自点按钮。每次桥掉下去时问："这样可以吗？"<br>· 问："你一直想靠什么来跨越这道深渊？"<br>· 一定要讲上面的问题，免得对方以为行善是不好的。')}`},
cross:{t:'耶稣的十字架',cap:'神先为我们开了路',html:`
<div class="stepNo">5 · 耶稣的十字架</div>
<h2>神先为我们<br>开辟了救恩之路</h2>
<p class="solo">人无法来到神面前，所以<b>神来到人间。</b>耶稣替我们承担了本该由我们承受的罪的刑罚，死在十字架上。</p>
<div class="btns"><button class="btn small ghost" onclick="replayCross()">▶ 重新播放</button></div>
${V('罗马书 5:8','惟有基督<b>在我们还作罪人的时候</b>为我们死，神的爱就在此向我们显明了。','green')}
${V('彼得前书 3:18','因基督也曾一次为罪受苦，<b>就是义的代替不义的，</b>为要引我们到神面前。','green')}
${Q('耶稣为什么必须死？','罪的工价乃是死，所以必须有人付这个代价。只有无罪的耶稣才能代替他人担当罪。十字架同时彰显了神的公义（罪必须付上代价）和神的爱（神亲自付了这代价）。')}
${N('· 强调"代替"：我本该承受的死亡，耶稣替我承担了。<br>· 罗5:8——不是在我们变好以后，而是"在我们还作罪人的时候"。')}`},
risen:{t:'复活的耶稣',cap:'耶稣复活了',html:`
<div class="stepNo">6 · 复活</div>
<h2>耶稣死了，<br>又复活了</h2>
<p class="solo">故事并没有随着耶稣在十字架上受死而结束。耶稣第三天<b>从死里复活了。</b>福音不只是叫我们铭记过去的牺牲，更是邀请我们<b>信靠今天活着的耶稣</b>，开始新的生命。</p>
<div class="btns"><button class="btn small ghost" onclick="replayRise()">▶ 重新播放</button></div>
${V('哥林多前书 15:3-4','就是基督照圣经所说，<b>为我们的罪死了，</b>而且埋葬了；又照圣经所说，<b>第三天复活了</b>','green')}
${V('约翰福音 14:6','耶稣说："<b>我就是道路、</b>真理、生命；若不藉着我，没有人能到父那里去。"','green')}
${Q('复活为什么这么重要？','复活是神所赐的确证，表明耶稣借着十字架确实胜过了罪和死亡。这也表示我们所信的不是纪念碑里的人物，而是今天活着、能与我建立关系的那一位。所以信心不只是"承认事实"，而是"信靠一位活着的主"。')}
${N('· 桥没有塌——复活使这座桥永远坚固。<br>· 林前15:3-4是保罗说"最要紧的"福音摘要。')}`},
gift:{t:'神的恩赐',cap:'永生是神白白的恩赐',html:`
<div class="stepNo">7 · 神的恩赐</div>
<h2>救恩不是报酬，<br>而是礼物</h2>
<p class="solo">礼物不是靠工作赚来的，而是<b>白白领受的。</b>请看图画中神那一边为你预备了什么。</p>
<div class="btns"><button class="btn gold" onclick="openGift()">🎁 再看一次</button></div>
${V('罗马书 6:23','因为罪的工价乃是死；<b>惟有神的恩赐，</b>在我们的主基督耶稣里，<b>乃是永生。</b>','green')}
<div class="cmp"><div class="a"><strong>罪的工价</strong>我做工的报酬<br>→ 应得的<br>→ <b>死</b></div><div class="b"><strong>神的恩赐</strong>白白赐给的礼物<br>→ 只要领受<br>→ <b>永生</b></div></div>
<div class="bubble"><b>什么是永生？</b>不只是永远活着，而是<b>认识神、与神一同生活的生命</b>。我们与神的关系从现在开始，延续到死亡之后。</div>
${V('约翰福音 17:3','<b>认识</b>你独一的真神，并且认识你所差来的耶稣基督，<b>这就是永生。</b>','green')}
${V('以弗所书 2:8-9','你们得救是本乎恩，也因着信；这并不是出于自己，<b>乃是神所赐的；</b>也不是出于行为，免得有人自夸。','green')}
${Q('白白得来，不是太容易了吗？','领受的人无需付出代价，但赐下礼物的神付出了最大的代价——他儿子的生命。不是因为这份礼物来得容易，而是因为我们永远无法偿还这代价，所以神把它当作礼物赐给我们。')}
${N('· 拿出一支笔说："这是送你的礼物。"怎样得到？→ 伸手接过来就可以。如果付钱，就不再是礼物了。<br>· 一节经文传福音（罗6:23）：问对方怎样理解"罪""恩赐""永生"。')}`},
story:{t:'我的故事',cap:'我也是借着这幅图认识了耶稣',html:`
<div class="stepNo">传讲者的故事</div>
<h2>我也是听了这个故事之后，<br>开始信耶稣的</h2>
<div id="testi"></div>
${N('· 传讲者可以用 ✏️ 按钮放入自己的见证：① 以前怎样看神 ② 从"桥"的比喻中领悟到了什么 ③ 信耶稣现在对我意味着什么。<br>· 不要给人"必须和我感受一样才算信"的印象。')}`},
respond:{t:'我的回应',cap:'你现在在哪一边？',html:`
<div class="stepNo">8 · 我的回应</div>
<h2>桥已经架好了，<br>接下来要做的，就是走过这座桥</h2>
<p class="solo">信耶稣，可以这样理解。</p>
<div class="cmp"><div class="a" style="background:#f3ece0"><strong>🔄 悔改</strong>离开凡事以自己为主的道路，转向神</div><div class="b"><strong>🤝 信心</strong>把自己交托给如今仍然活着的耶稣</div></div>
${V('使徒行传 20:21','对犹太人和希腊人证明<b>当向神悔改，</b><b>信靠我主耶稣基督。</b>','green')}
${V('约翰福音 1:12','<b>凡接待他的，</b>就是信他名的人，他就<b>赐他们权柄作神的儿女。</b>','green')}
${V('启示录 3:20','看哪，<b>我站在门外叩门，</b>若有听见我声音就<b>开门的，</b>我要进到他那里去，我与他，他与我一同坐席。','green')}
${Q('相信就是承认这是事实吗？','从承认开始，但不止于此。知道椅子很结实并不能让你休息，你必须真的坐下，让椅子承托你的身体。信心就是相信耶稣为我死而复活，并以此为根基，<b>把自己交托给他</b>。')}
<div class="bubble">在这幅图里，你现在在哪里？请选择最接近你心意的一项。</div>
<div class="btns" style="flex-direction:column">
 <button class="btn gold" onclick="go(idx('pray'),1)">🙏 我想向神祷告</button>
 <button class="btn ghost" onclick="moreFaith()">📖 我想多了解信耶稣是什么意思</button>
 <button class="btn ghost" onclick="go(idx('faq'),1)">❓ 我还有问题</button>
 <button class="btn ghost" onclick="pause()">🌙 今天就看到这里</button>
 <button class="btn ghost" style="border-style:dashed" onclick="go(idx('assure'),1)">😊 我已经信耶稣了</button>
</div>
<div id="whereBox"></div>
${N('· 指着图中的人问对方。不要强迫，耐心等待，沉默也没关系。<br>· 尊重任何选择，约好再见面或留下联系方式。')}`},
pray:{t:'祷告',cap:'凭信心走过这座桥',html:`
<div class="stepNo">9 · 祷告</div>
<h2>把你的心意<br>告诉神</h2>
<p style="font-size:.88em;color:var(--sub)">照着念这些句子本身并不能使人得救。重要的是信靠耶稣、真诚地来到神面前。下面的祷告只是帮助你表达心意的<b>例子</b>。</p>
<div class="prayer">神啊，<br>我是离开你、按自己意思生活的罪人，求你赦免我。<br>我相信耶稣为我的罪死在十字架上，又复活了。<br>现在我离开过去以自己为中心的道路，<b>接受耶稣作我的救主和生命的主。</b><br>感谢你把永生当作礼物赐给我。<br>奉耶稣的名祷告，<b>阿们。</b></div>
<div class="btns"><button class="btn gold" id="amenBtn" onclick="amen()">🙏 我真心作了这个祷告</button></div>
<div id="amenBox"></div>
${Q('悔改了，就必须成为完美的人吗？','不是的。悔改不是承诺变得完美，而是<b>转变方向</b>。我们仍会跌倒，但神的儿女会回到神面前，蒙赦免，继续成长（约翰一书 1:9）。')}
${N('· 可以由传讲者先读一句，再请对方跟着祷告。<br>· 祷告后立刻进入得救确据的经文——根据神的应许，而不是感觉。')}`},
assure:{t:'得救的确据',cap:'已经出死入生了',html:`
<div class="stepNo">10 · 确据</div>
<h2>永生现在<br>已经是我的了</h2>
<p>点空格，看看神的应许。</p>
<div class="verse green"><div class="ref">约翰福音 5:24</div><div class="tx">我实实在在地告诉你们，那听我话、又信差我来者的，就${B('有永生')}；${B('不至于定罪')}，是已经${B('出死入生')}了。</div></div>
<div id="blankMsg"></div>
${V('约翰一书 5:11-13','这见证就是神赐给我们永生，这永生也是在他儿子里面。<b>人有了神的儿子就有生命；</b>没有神的儿子就没有生命。我将这些话写给你们信奉神儿子之名的人，<b>要叫你们知道自己有永生。</b>','green')}
<p class="solo" style="font-size:.9em;color:var(--sub)">确据不是建立在感觉上，而是建立在<b>神的话语</b>上。</p>
${TRAIN('事实','神的话语','信心','信靠神的话','感觉','随后跟来')}
${Q('如果我还不能确信自己已经得救，也没关系吗？','没关系。对得救的确信并非一朝一夕就能建立，而会随着阅读神的话语逐渐加深。若还有问题，随时可以问，也请每天读一章《约翰福音》。神必与诚心寻求他的人相遇。')}
${N('· 注意时态："就有永生""已经出死入生"——这是已经成就的事实。<br>· 火车比喻：火车头（事实）拉动，煤车（信心）供给，车厢（感觉）跟随。')}`},
next:{t:'下一步',cap:'在神这一边开始的新生命',html:`
<div class="stepNo">11 · 下一步</div>
<h2>新生命如何成长</h2>
<p class="solo">就像新生的婴儿要吃、要呼吸、在家中长大，基督徒也借着<b>四件事</b>成长。</p>
${WHEEL('神的话','祷告','团契','见证','基督','中心','顺服的基督徒生活')}
${WLIST([
['c','中心 · 基督','生命有了新的主','哥林多后书 5:17','若有人在基督里，他就是新造的人，旧事已过，都变成新的了。','加拉太书 2:20'],
['w','神的话','每天读一章《约翰福音》','提摩太后书 3:16','圣经都是神所默示的，于教训、督责、使人归正、教导人学义都是有益的。','约书亚记 1:8'],
['p','祷告','什么事都可以告诉神','约翰福音 15:7','你们若常在我里面，我的话也常在你们里面，凡你们所愿意的，祈求，就给你们成就。','腓立比书 4:6-7'],
['f','团契','与向你传福音的人及教会相伴','马太福音 18:20','因为无论在哪里，有两三个人奉我的名聚会，那里就有我在他们中间。','希伯来书 10:24-25'],
['e','见证','把领受的礼物分享给别人','马太福音 4:19','耶稣对他们说：“来跟从我，我要叫你们得人如得鱼一样。”','罗马书 1:16'],
['rim','轮圈 · 顺服','在生活中照着神的话去行','罗马书 12:1','所以弟兄们，我以神的慈悲劝你们，将身体献上，当作活祭，是圣洁的，是神所喜悦的；你们如此事奉乃是理所当然的。','约翰福音 14:21']
])}
${BDAY('🎂 我的属灵生日','名字','制作属灵生日卡')}
${N('· 车轮比喻：力量来自中心（基督）。竖的轮辐（神的话、祷告）是与神的关系，横的轮辐（团契、见证）是与人的关系。<br>· 约好在一周内再见面，从一起读《约翰福音》开始，陪伴对方在信仰上成长。')}`},
summary:{t:'总结',cap:'神的恩赐 永生——生命之桥',html:`
<div class="stepNo">总结</div>
<h2>一眼看懂福音</h2>
<div class="verse"><div class="tx" style="font-size:.95em;line-height:1.9">
① <b>神的心意</b>——约3:16；10:10<br>② <b>人的问题：罪</b>——罗3:23；赛53:6；59:2<br>③ <b>罪的结果</b>——罗6:23上；来9:27<br>④ <b>我们的局限</b>——弗2:8-9<br>⑤ <b>耶稣的十字架</b>——罗5:8；彼前3:18<br>⑥ <b>复活</b>——林前15:3-4；约14:6<br>⑦ <b>永生的恩赐</b>——罗6:23；约17:3<br>⑧ <b>我的回应</b>——徒20:21；约1:12；启3:20<br>⑨ <b>确据</b>——约5:24；约壹5:11-13</div></div>
<div class="btns"><button class="btn" onclick="go(0)">重新开始</button><button class="btn ghost" onclick="share()">🔗 分享这个应用</button></div>
<p style="font-size:.75em;color:#999">经文引自《和合本》圣经。</p>
${N('· 一边在纸上画这幅图一边再讲一遍，并把这张纸送给对方。<br>· 确认理解："人的问题是什么？""耶稣做了什么？""相信是什么意思？""哪里不明白？"')}`},
faq:{t:'常见问题',cap:'随时都可以提问',html:`
<div class="stepNo">问题</div>
<h2>你还有问题吗？</h2>
<p>提问不是信心的反面。请点你想问的问题。</p>
<div id="faqAll"></div>
<div class="bubble">这里没有的问题，请直接问分享这个应用给你的人，他们会很乐意和你交谈。</div>
<div class="btns"><button class="btn ghost" onclick="go(idx('respond'),-1)">◀ 回到我的回应</button></div>`}
}),
ru:()=>({
start:{t:'Начало',cap:'',html:`
<div class="stepNo">БОЖИЙ ДАР</div>
<h2>Между Богом и мной —<br>какой путь открыл Иисус?</h2>
<p>Узнайте суть христианской вести через <b>картинку и короткие объяснения</b>. Это займет около 10 минут, и вы в любой момент можете остановиться и задать вопрос.</p>
<div class="btns qRow"><button class="btn qBtn" onclick="setShort(true,0)">${QS.ru.btn}<br><span style="font-weight:400;font-size:.8em">${QS.ru.sub}</span></button></div>
<div class="btns" style="flex-direction:column">
 <button class="btn" onclick="setMode('together',true)">👥 Смотреть вместе<br><span style="font-weight:400;font-size:.8em">с человеком, который делится с вами</span></button>
 <button class="btn ghost" onclick="setMode('alone',true)">🙋 Самостоятельно<br><span style="font-weight:400;font-size:.8em">читать и слушать в своем темпе</span></button>
</div>${LANGBTNS}
${N('· В режиме «Вместе» меньше текста и больше картинка. Эти заметки (📝) — только для того, кто делится.<br>· Вопрос для начала разговора: «Если бы ваша жизнь закончилась сегодня ночью, уверены ли вы, что попадете на небо?» «На каком основании?»<br>· Спросите разрешения: «Можно я покажу одной простой картинкой, как Библия отвечает на этот вопрос?»')}`},
love:{t:'Божий замысел',cap:'В начале Бог и человек были вместе',html:`
<div class="stepNo">1 · БОЖИЙ ЗАМЫСЕЛ</div>
<h2>Бог любит нас и создал нас,<br>чтобы мы жили с Ним</h2>
<p class="solo">Библия говорит, что Бог сотворил человека по Своему образу и хотел, чтобы человек жил с Ним в <b>близких отношениях.</b> Как видно на картинке, вначале между Богом и людьми не было разрыва.</p>
<p class="solo">Почему же тогда мы чувствуем себя далекими от Бога и раним друг друга?</p>
${V('Иоанна 3:16','Ибо <b>так возлюбил Бог мир</b>, что отдал Сына Своего Единородного, дабы всякий верующий в Него, не погиб, но <b>имел жизнь вечную.</b>')}
${V('Иоанна 10:10','Я пришел для того, чтобы имели жизнь и <b>имели с избытком.</b>')}
${Q('Я не уверен, что Бог вообще существует.','Это нормально. Это приложение не заставит вас верить. Выслушайте до конца, что Библия говорит о Боге и человеке, а потом решите сами. Вопросы всегда приветствуются.')}
${N('· Предложите прочитать Иоанна 3:16, поставив свое имя вместо слова «мир».<br>· Спросите: «Что вы чувствуете, когда слышите, что Бог любит вас?»<br>· Почему же многие не ощущают эту любовь? → Далее')}`},
sin:{t:'Наша проблема — грех',cap:'Грех отделил человека от Бога',html:`
<div class="stepNo">2 · НАША ПРОБЛЕМА</div>
<h2>Грех отделил нас<br>от Бога</h2>
<p class="solo">В Библии грех — это не только плохие поступки. Это <b>позиция, при которой я не доверяю Богу и живу без Него как хозяин своей жизни</b>, — и поступки, которые из этого вытекают.</p>
<div class="btns"><button class="btn small ghost" onclick="replayCrack()">▶ Повторить</button></div>
${V('Римлянам 3:23','потому что <b>все согрешили</b> и лишены славы Божией,','red')}
${V('Исаия 53:6','Все мы блуждали, как овцы, <b>совратились каждый на свою дорогу:</b> и Господь возложил на Него грехи всех нас.','red')}
${V('Исаия 59:2','Но беззакония ваши <b>произвели разделение между вами и Богом вашим,</b> и грехи ваши отвращают лице Его от вас, чтобы не слышать.','red')}
${Q('Я стараюсь быть хорошим человеком. Я все равно грешник?','Грех в Библии — это не вопрос того, насколько велико преступление, а вопрос <b>направления.</b> Даже если я живу достойно, но сам себе хозяин и иду «своей дорогой» без Бога, мои отношения с Ним разрушены. В стрельбе из лука промах на 1 см или на 1 м — все равно промах. Библейское слово «грех» означает именно это: «промахнуться мимо цели».')}
${N('· Спросите, относится ли слово «все» в Римлянам 3:23 к нему: «Это и про вас? Это и про меня».<br>· Говорите тоном «я тоже был таким», а не осуждения.')}`},
death:{t:'Последствие греха',cap:'Возмездие за грех — смерть, а потом суд',html:`
<div class="stepNo">3 · ПОСЛЕДСТВИЕ</div>
<h2>Последствие греха —<br>смерть и суд</h2>
<p class="solo">Библия говорит, что возмездие за грех — <b>смерть.</b> Это не только физическая смерть, но вечное отделение от Бога, Источника жизни.</p>
<p class="solo">Разрыв, который производит грех, — это не долина, где внизу земля сходится, а <b>бездонная пропасть.</b></p>
${V('Римлянам 6:23 (начало)','Ибо <b>возмездие за грех — смерть</b>','red')}
${V('Евреям 9:27','И как человекам положено однажды умереть, <b>а потом суд,</b>','red')}
${Q('Если Бог есть любовь, зачем Он судит?','Любовь и справедливость не противоположны. Судья, который просто не замечает зла, — плохой судья. Поскольку Бог свят, Он судит грех; а поскольку Он есть любовь, Он приготовил путь, чтобы этот суд понес Другой. Об этом — дальше.')}
${N('· Спросите: «Что такое возмездие (плата)?» → то, что получаешь за свой труд.<br>· Говорите спокойно о фактах, не пугая.<br>· «Как люди пытаются перебраться через эту пропасть?» → Далее')}`},
effort:{t:'Наши пределы',cap:'Никакие усилия не достигают Бога',html:`
<div class="stepNo">4 · НАШИ ПРЕДЕЛЫ</div>
<h2>Своими усилиями<br>нам не перейти</h2>
<p>Люди строят много мостов, чтобы перейти эту пропасть. Нажмите на кнопку и <b>попробуйте сами.</b></p>
<div class="btns effBtns">${UI[st.lang].eff.map((e,i)=>`<button class="btn ghost" onclick="tryPlank(this,${i})">${e.label}</button>`).join('')}</div>
<div id="effortMsg"></div>
${Q('Значит, добрая жизнь не имеет смысла?','Нет. Добрые дела ценны, и Богу они угодны. Просто спасение <b>нельзя купить</b> добрыми делами. Порядок обратный: мы приходим к Богу не делая добро, а спасенные Божией благодатью из благодарности живут, делая добро (Ефесянам 2:10).')}
${N('· Пусть собеседник сам нажимает кнопки. Каждый раз, когда доска падает: «Получится?»<br>· Спросите: «На что вы опирались, чтобы перейти эту пропасть?»<br>· Обязательно разберите вопрос выше, чтобы добрые дела не казались чем-то плохим.')}`},
cross:{t:'Крест Иисуса',cap:'Бог первым открыл путь',html:`
<div class="stepNo">5 · КРЕСТ</div>
<h2>Бог Сам открыл<br>путь спасения</h2>
<p class="solo">Мы не могли прийти к Богу — и <b>Бог пришел к нам.</b> Иисус вместо нас понес наказание за наш грех и умер на кресте.</p>
<div class="btns"><button class="btn small ghost" onclick="replayCross()">▶ Повторить</button></div>
${V('Римлянам 5:8','Но Бог Свою любовь к нам доказывает тем, что Христос умер за нас, <b>когда мы были еще грешниками.</b>','green')}
${V('1 Петра 3:18','потому что и Христос, чтобы привести нас к Богу, однажды пострадал за грехи наши, <b>праведник за неправедных,</b> быв умерщвлен по плоти, но ожив духом,','green')}
${Q('Почему Иисусу нужно было умереть?','Поскольку возмездие за грех — смерть, кто-то должен был заплатить эту цену. Только безгрешный Иисус мог понести грехи других. Крест — это место, где вместе видны Божья справедливость (за грех нужно заплатить) и Его любовь (Бог платит Сам).')}
${N('· Подчеркните «вместо нас»: Иисус принял смерть, которую заслужил я.<br>· Римлянам 5:8 — не после того, как мы стали хорошими, а «когда мы были еще грешниками».')}`},
risen:{t:'Воскресший Иисус',cap:'Иисус воскрес',html:`
<div class="stepNo">6 · ВОСКРЕСЕНИЕ</div>
<h2>Иисус умер<br>и воскрес</h2>
<p class="solo">История не заканчивается крестом. В третий день Иисус <b>воскрес из мертвых.</b> Евангелие — это не просто призыв помнить о прошлой жертве, а приглашение <b>довериться живому Иисусу</b> и начать новую жизнь.</p>
<div class="btns"><button class="btn small ghost" onclick="replayRise()">▶ Повторить</button></div>
${V('1 Коринфянам 15:3-4','Ибо я первоначально преподал вам, что и сам принял, то есть, что <b>Христос умер за грехи наши,</b> по Писанию, и что Он погребен был, и что <b>воскрес в третий день,</b> по Писанию,','green')}
${V('Иоанна 14:6','Иисус сказал ему: <b>Я есмь путь и истина и жизнь;</b> никто не приходит к Отцу, как только через Меня.','green')}
${Q('Почему воскресение так важно?','Воскресение — Божье доказательство того, что крест действительно победил грех и смерть. А еще это значит, что Тот, в Кого мы верим, — не памятник, а Живой, Который сегодня может иметь со мной отношения. Поэтому вера — это больше чем «признать факт»; это «довериться живой Личности».')}
${N('· Мост не рухнул — воскресение держит его навеки.<br>· 1 Кор 15:3-4 — это то, что Павел передал «прежде всего» как Евангелие.')}`},
gift:{t:'Божий дар',cap:'Вечная жизнь — даром от Бога',html:`
<div class="stepNo">7 · ДАР</div>
<h2>Спасение — не награда,<br>а дар</h2>
<p class="solo">Подарок не зарабатывают — его <b>получают даром.</b> Посмотрите, что Бог приготовил на Своей стороне картинки.</p>
<div class="btns"><button class="btn gold" onclick="openGift()">🎁 Показать снова</button></div>
${V('Римлянам 6:23','Ибо возмездие за грех — смерть, а <b>дар Божий — жизнь вечная</b> во Христе Иисусе, Господе нашем.','green')}
<div class="cmp"><div class="a"><strong>Возмездие за грех</strong>то, что я заработал<br>→ то, что я заслужил<br>→ <b>смерть</b></div><div class="b"><strong>Дар Божий</strong>дается даром<br>→ нужно только принять<br>→ <b>вечная жизнь</b></div></div>
<div class="bubble"><b>Что такое вечная жизнь?</b> Это не просто бесконечная жизнь. Это <b>жизнь, в которой мы знаем Бога и живем с Ним,</b> — отношения, которые начинаются уже сейчас и продолжаются после смерти.</div>
${V('Иоанна 17:3','<b>Сия же есть жизнь вечная,</b> да <b>знают</b> Тебя, единого истинного Бога, и посланного Тобою Иисуса Христа.','green')}
${V('Ефесянам 2:8-9','Ибо благодатью вы спасены через веру, и сие не от вас, <b>Божий дар:</b> не от дел, чтобы никто не хвалился.','green')}
${Q('Если даром, то не слишком ли это просто?','Для получающего это даром, но Бог заплатил самую высокую цену — жизнь Своего Сына. Он дает это как дар не потому, что это дешево, а потому, что мы никогда не смогли бы это оплатить.')}
${N('· Протяните ручку и скажите: «Это вам в подарок». Как его получить? → Просто протянуть руку и взять. Если заплатить — это уже не подарок.<br>· Метод одного стиха (Римлянам 6:23): спросите, что он думает о словах «грех», «дар» и «вечная жизнь».')}`},
story:{t:'Моя история',cap:'Я тоже встретил Иисуса через эту картинку',html:`
<div class="stepNo">ИСТОРИЯ ТОГО, КТО ДЕЛИТСЯ</div>
<h2>Я тоже услышал эту весть<br>и поверил в Иисуса</h2>
<div id="testi"></div>
${N('· Кнопкой ✏️ можно вставить свое свидетельство: ① как вы раньше думали о Боге ② что вы поняли через картинку моста ③ что значит для вас вера в Иисуса сейчас.<br>· Не создавайте впечатления, что человек должен почувствовать то же самое, что и вы.')}`},
respond:{t:'Мой ответ',cap:'На какой вы сейчас стороне?',html:`
<div class="stepNo">8 · МОЙ ОТВЕТ</div>
<h2>Мост уже есть.<br>Теперь время перейти</h2>
<p class="solo">Верить в Иисуса — это можно описать так:</p>
<div class="cmp"><div class="a" style="background:#f3ece0"><strong>🔄 Покаяться</strong>отвернуться от пути, где я сам себе хозяин</div><div class="b"><strong>🤝 Поверить</strong>довериться живому Иисусу</div></div>
${V('Деяния 20:21','возвещая Иудеям и Еллинам <b>покаяние пред Богом</b> и <b>веру в Господа нашего Иисуса Христа.</b>','green')}
${V('Иоанна 1:12','А <b>тем, которые приняли Его,</b> верующим во имя Его, дал <b>власть быть чадами Божиими,</b>','green')}
${V('Откровение 3:20','Се, <b>стою у двери и стучу:</b> если кто услышит голос Мой и <b>отворит дверь,</b> войду к нему, и буду вечерять с ним, и он со Мною.','green')}
${Q('Верить — значит согласиться, что это правда?','Это начинается с согласия, но на нем не заканчивается. Если вы знаете, что стул крепкий, вы еще не отдыхаете; нужно на самом деле сесть и опереться на него. Вера — это <b>доверить себя</b> тому факту, что Иисус умер и воскрес за меня.')}
<div class="bubble">Где вы сейчас на этой картинке? Выберите то, что ближе всего вашему сердцу.</div>
<div class="btns" style="flex-direction:column">
 <button class="btn gold" onclick="go(idx('pray'),1)">🙏 Я хочу помолиться Богу</button>
 <button class="btn ghost" onclick="moreFaith()">📖 Я хочу больше узнать о вере в Иисуса</button>
 <button class="btn ghost" onclick="go(idx('faq'),1)">❓ У меня еще есть вопросы</button>
 <button class="btn ghost" onclick="pause()">🌙 На сегодня достаточно</button>
 <button class="btn ghost" style="border-style:dashed" onclick="go(idx('assure'),1)">😊 Я уже верю в Иисуса</button>
</div>
<div id="whereBox"></div>
${N('· Покажите на человечка на картинке и спросите. Не давите; подождите. Молчание — это нормально.<br>· Уважайте любой выбор и договоритесь о новой встрече или обменяйтесь контактами.')}`},
pray:{t:'Молитва',cap:'Переходим мост верой',html:`
<div class="stepNo">9 · МОЛИТВА</div>
<h2>Скажите Богу,<br>что у вас на сердце</h2>
<p style="font-size:.88em;color:var(--sub)">Спасает не само чтение этих слов. Важно честно прийти к Богу, доверившись Иисусу. Молитва ниже — это <b>пример,</b> который поможет выразить ваше сердце.</p>
<div class="prayer">Боже,<br>я грешник, который оставил Тебя и жил по-своему. Прости меня.<br>Я верю, что Иисус умер на кресте за мои грехи и воскрес.<br>Теперь я отворачиваюсь от своего пути и <b>принимаю Иисуса как моего Спасителя и Господа.</b><br>Спасибо Тебе за дар вечной жизни.<br>Молюсь во имя Иисуса. <b>Аминь.</b></div>
<div class="btns"><button class="btn gold" id="amenBtn" onclick="amen()">🙏 Я искренне помолился этой молитвой</button></div>
<div id="amenBox"></div>
${Q('Если я покаюсь, я должен стать совершенным?','Нет. Покаяние — это не обещание стать совершенным, а <b>смена направления.</b> Мы еще будем спотыкаться, но Божьи дети возвращаются к Нему, получают прощение и продолжают расти (1 Иоанна 1:9).')}
${N('· Хорошо читать по одной строке и давать человеку повторить.<br>· После молитвы сразу переходите к стихам об уверенности — опираясь на Божье обещание, а не на чувства.')}`},
assure:{t:'Уверенность',cap:'Перешел от смерти в жизнь',html:`
<div class="stepNo">10 · УВЕРЕННОСТЬ</div>
<h2>Вечная жизнь<br>уже моя</h2>
<p>Нажмите на пропуски, чтобы увидеть Божье обещание.</p>
<div class="verse green"><div class="ref">Иоанна 5:24</div><div class="tx">Истинно, истинно говорю вам: слушающий слово Мое и верующий в Пославшего Меня ${B('имеет жизнь вечную')}, и ${B('на суд не приходит')}, но ${B('перешел')} от смерти в жизнь.</div></div>
<div id="blankMsg"></div>
${V('1 Иоанна 5:11-13','Свидетельство сие состоит в том, что Бог даровал нам жизнь вечную, и сия жизнь в Сыне Его. <b>Имеющий Сына (Божия) имеет жизнь;</b> не имеющий Сына Божия не имеет жизни. Сие написал я вам, верующим во имя Сына Божия, <b>дабы вы знали, что вы, веруя в Сына Божия, имеете жизнь вечную.</b>','green')}
<p class="solo" style="font-size:.9em;color:var(--sub)">Уверенность стоит не на чувствах, а на <b>Божьем слове.</b></p>
${TRAIN('Факт','Божье слово','Вера','доверие слову','Чувства','следуют за ними')}
${Q('А если я еще не уверен?','Ничего страшного. Уверенность приходит не сразу; она растет, когда вы читаете Божье слово. Если остались вопросы, спрашивайте в любое время и читайте каждый день по одной главе Евангелия от Иоанна. Бог встречает тех, кто честно ищет Его.')}
${N('· Обратите внимание на время глаголов: не «будет иметь», а «имеет жизнь вечную», «перешел» — уже совершилось.<br>· Пример с поездом: тянет локомотив (факт), тендер с углем (вера) дает силу, последний вагон (чувства) следует за ними.')}`},
next:{t:'Следующие шаги',cap:'На Божьей стороне начинается новая жизнь',html:`
<div class="stepNo">11 · СЛЕДУЮЩИЕ ШАГИ</div>
<h2>Как растет новая жизнь</h2>
<p class="solo">Как новорожденный ребенок ест, дышит и растет в семье, так христианин растет <b>четырьмя путями.</b></p>
${WHEEL('Слово','Молитва','Общение','Свидетельство','Христос','центр','ПОСЛУШНЫЙ ХРИСТИАНИН')}
${WLIST([
['c','Ступица · Христос','новый человек с новым Господом','2 Коринфянам 5:17','Итак, кто во Христе, тот новая тварь; древнее прошло, теперь все новое.','Галатам 2:20'],
['w','Слово','по одной главе Евангелия от Иоанна в день','2 Тимофею 3:16','Все Писание богодухновенно и полезно для научения, для обличения, для исправления, для наставления в праведности,','Иисус Навин 1:8'],
['p','Молитва','говорить с Богом обо всем','Иоанна 15:7','Если пребудете во Мне и слова Мои в вас пребудут, то, чего ни пожелаете, просите, и будет вам.','Филиппийцам 4:6-7'],

risen:{t:'जीवित येशू',cap:'येशू फेरि जीवित हुनुभयो',html:`
<div class="stepNo">६ · पुनरुत्थान</div>
<h2>येशू मर्नुभयो,<br>र फेरि जीवित हुनुभयो</h2>
<p class="solo">कथा क्रूसमा सकिँदैन। तेस्रो दिनमा येशू <b>मरेकाहरूबाट जीवित हुनुभयो।</b> सुसमाचार विगतको बलिदान सम्झने आह्वान मात्र होइन — <b>जीवित येशूमाथि भरोसा गरेर</b> नयाँ जीवन सुरु गर्ने निम्तो हो।</p>
<div class="btns"><button class="btn small ghost" onclick="replayRise()">▶ फेरि हेर्ने</button></div>
${V('1 कोरिन्थी 15:3-4','किनभने मैले जे पाएँ त्‍यसैलाई सबैभन्‍दा मुख्‍य विषयको रूपमा तिमीहरूलाई सुम्‍पिदिएँ, अर्थात्‌ पवित्र धर्मशास्‍त्रअनुसार <b>ख्रीष्‍ट हाम्रा पापका निम्‍ति मर्नुभयो,</b> उहाँ गाडिनुभयो, र पवित्र धर्मशास्‍त्रअनुसार <b>तेस्रो दिनमा उहाँ पुनर्जीवित पारिनुभयो।</b>','green')}
${V('यूहन्ना 14:6','येशूले तिनलाई भन्‍नुभयो, “<b>बाटो, सत्‍य र जीवन म नै हुँ।</b> मद्वारा बाहेक कोही पनि पिताकहाँ आउन सक्‍दैन।”','green')}
${Q('पुनरुत्थान किन यति महत्त्वपूर्ण छ?','पुनरुत्थान क्रूसले साँच्चै पाप र मृत्युमाथि विजय पायो भन्ने परमेश्‍वरको प्रमाण हो। साथै हामीले विश्‍वास गर्नुहुने व्यक्ति स्मारकमा भएको व्यक्ति होइन, आज पनि जीवित भएर मसँग सम्बन्ध राख्न सक्नुहुने व्यक्ति हुनुहुन्छ। त्यसैले विश्‍वास "तथ्य स्वीकार गर्नु" मात्र होइन — "जीवित व्यक्तिमाथि भरोसा गर्नु" हो।')}
${N('· पुल भत्किएन — पुनरुत्थानले यसलाई सधैँका लागि बलियो बनाउँछ।<br>· 1 कोरिन्थी 15:3-4 पावलले "सबैभन्दा मुख्य" भनेर सुम्पेको सुसमाचार हो।')}`},
gift:{t:'परमेश्‍वरको वरदान',cap:'अनन्त जीवन परमेश्‍वरको सित्तैँको वरदान',html:`
<div class="stepNo">७ · वरदान</div>
<h2>मुक्ति इनाम होइन,<br>वरदान हो</h2>
<p class="solo">उपहार काम गरेर कमाइँदैन; त्यो <b>सित्तैँमा पाइन्छ।</b> चित्रमा परमेश्‍वरको पट्टि उहाँले के तयार गर्नुभएको छ, हेर्नुहोस्।</p>
<div class="btns"><button class="btn gold" onclick="openGift()">🎁 फेरि देखाउने</button></div>
${V('रोमी 6:23','किनकि पापको ज्‍याला मृत्‍यु हो, तर <b>परमेश्‍वरको सित्तैँको वरदान</b> ख्रीष्‍ट येशू हाम्रा प्रभुमा <b>अनन्‍त जीवन हो।</b>','green')}
<div class="cmp"><div class="a"><strong>पापको ज्याला</strong>मैले कमाएको<br>→ म योग्य भएको<br>→ <b>मृत्यु</b></div><div class="b"><strong>परमेश्‍वरको वरदान</strong>सित्तैँमा दिइएको<br>→ केवल ग्रहण गर्ने<br>→ <b>अनन्त जीवन</b></div></div>
<div class="bubble"><b>अनन्त जीवन भनेको के हो?</b> सधैँ बाँचिरहनु मात्र होइन। <b>परमेश्‍वरलाई चिनेर उहाँसँग बाँच्ने जीवन</b> हो — अहिले नै सुरु भएर मृत्युपछि पनि जारी रहने सम्बन्ध।</div>
${V('यूहन्ना 17:3','<b>अब अनन्‍त जीवन यही हो,</b> कि तिनीहरूले तपाईं, एकमात्र सत्‍य परमेश्‍वरलाई <b>चिनून्,</b> र तपाईंले पठाउनुभएको येशू ख्रीष्‍टलाई चिनून्‌।','green')}
${V('एफिसी 2:8-9','किनभने अनुग्रहबाट विश्‍वासद्वारा तिमीहरूले उद्धार पाएका छौ— र यो तिमीहरू आफैबाट होइन, <b>यो त परमेश्‍वरको वरदान हो</b>— कर्महरूद्वारा होइन, नत्रता मानिसले घमण्‍ड गर्नेछ।','green')}
${Q('सित्तैँमा भए त धेरै सजिलो भएन र?','पाउनेका लागि सित्तैँ हो, तर परमेश्‍वरले सबैभन्दा ठूलो मूल्य — आफ्नो पुत्रको जीवन — तिर्नुभयो। सस्तो भएर होइन, हामीले कहिल्यै तिर्न नसक्ने भएकाले उहाँ यो वरदानको रूपमा दिनुहुन्छ।')}
${N('· एउटा कलम दिँदै भन्नुहोस्: "यो तपाईंलाई उपहार हो।" यो कसरी पाउने? → हात पसारेर लिने। पैसा तिर्नुभयो भने त्यो उपहार रहँदैन।<br>· एक पद विधि (रोमी 6:23): "पाप", "वरदान", "अनन्त जीवन" शब्दबारे उहाँ के सोच्नुहुन्छ, सोध्नुहोस्।')}`},
story:{t:'मेरो कथा',cap:'म पनि यही चित्रद्वारा येशूलाई भेटें',html:`
<div class="stepNo">बाँड्ने व्यक्तिको कथा</div>
<h2>म पनि यो सन्देश सुनेर<br>येशूमाथि विश्‍वास गरें</h2>
<div id="testi"></div>
${N('· ✏️ बटनले आफ्नो गवाही राख्न सकिन्छ: ① पहिले परमेश्‍वरबारे कस्तो सोच्नुहुन्थ्यो ② पुलको चित्रबाट के बुझ्नुभयो ③ अहिले येशूमाथिको विश्‍वासको अर्थ के हो।<br>· सबैले तपाईंले जस्तै अनुभव गर्नैपर्छ भन्ने छाप नदिनुहोस्।')}`},
respond:{t:'मेरो प्रतिक्रिया',cap:'अहिले तपाईं कुन पट्टि हुनुहुन्छ?',html:`
<div class="stepNo">८ · मेरो प्रतिक्रिया</div>
<h2>पुल तयार छ।<br>अब पार गर्ने बेला हो</h2>
<p class="solo">येशूमाथि विश्‍वास गर्नुलाई यसरी भन्न सकिन्छ:</p>
<div class="cmp"><div class="a" style="background:#f3ece0"><strong>🔄 पश्‍चात्ताप</strong>आफैँ मालिक भएको बाटोबाट फर्कने</div><div class="b"><strong>🤝 विश्‍वास</strong>जीवित येशूमा आफूलाई सुम्पने</div></div>
${V('प्रेरित 20:21','यहूदीहरूलाई र ग्रीकहरूलाई <b>पश्‍चात्ताप गरेर परमेश्‍वरपट्टि फर्कनू</b> र <b>हाम्रा प्रभु येशू ख्रीष्‍टमाथि विश्‍वास राख्‍नू</b> भन्‍ने कुराको गवाही मैले दिएको छु।','green')}
${V('यूहन्ना 1:12','तर <b>जतिले उहाँलाई ग्रहण गरे</b> र उहाँको नाउँमाथि विश्‍वास गरे, उहाँले तिनीहरूलाई <b>परमेश्‍वरका सन्‍तान हुने अधिकार</b> दिनुभयो।','green')}
${V('प्रकाश 3:20','हेर, <b>म ढोकामा उभिएर ढकढक्‍याउँछु।</b> कसैले मेरो सोर सुनेर <b>ढोका खोलिदियो भने,</b> म त्‍यसकहाँ भित्र पस्‍नेछु र त्‍यससँग भोजन खानेछु, र त्‍यसले मसँग खानेछ।','green')}
${Q('विश्‍वास गर्नु भनेको यो सत्य हो भनी सहमत हुनु हो?','सहमतिबाट सुरु हुन्छ, तर त्यहीँ रोकिँदैन। कुर्सी बलियो छ भन्ने थाहा पाउँदैमा आराम पाइँदैन; साँच्चै बसेर आफ्नो भार त्यसमा राख्नुपर्छ। विश्‍वास भनेको येशू मेरा लागि मर्नुभयो र जीवित हुनुभयो भन्ने तथ्यमा <b>आफूलाई सुम्पनु</b> हो।')}
<div class="bubble">अहिले तपाईं चित्रको कहाँ हुनुहुन्छ? आफ्नो मनसँग सबैभन्दा मिल्ने कुरा छान्नुहोस्।</div>
<div class="btns" style="flex-direction:column">
 <button class="btn gold" onclick="go(idx('pray'),1)">🙏 म परमेश्‍वरसँग प्रार्थना गर्न चाहन्छु</button>
 <button class="btn ghost" onclick="moreFaith()">📖 येशूमाथि विश्‍वास गर्नेबारे अझै जान्न चाहन्छु</button>
 <button class="btn ghost" onclick="go(idx('faq'),1)">❓ मसँग अझै प्रश्नहरू छन्</button>
 <button class="btn ghost" onclick="pause()">🌙 आजलाई यति नै</button>
 <button class="btn ghost" style="border-style:dashed" onclick="go(idx('assure'),1)">😊 म पहिले नै येशूमाथि विश्‍वास गर्छु</button>
</div>
<div id="whereBox"></div>
${N('· चित्रको मानिसलाई देखाउँदै सोध्नुहोस्। दबाब नदिनुहोस्; पर्खनुहोस्। चुप लाग्नु पनि ठीक छ।<br>· जुनसुकै निर्णयको आदर गर्नुहोस्, र फेरि भेट्ने वा सम्पर्क साटासाट गर्ने व्यवस्था गर्नुहोस्।')}`},
pray:{t:'प्रार्थना',cap:'विश्‍वासद्वारा पुल पार गर्ने',html:`
<div class="stepNo">९ · प्रार्थना</div>
<h2>आफ्नो मनको कुरा<br>परमेश्‍वरलाई भन्नुहोस्</h2>
<p style="font-size:.88em;color:var(--sub)">यी शब्दहरू पढ्नैले मुक्ति दिने होइन। येशूमाथि भरोसा गर्दै इमानदारीसाथ परमेश्‍वरकहाँ आउनु महत्त्वपूर्ण हो। तलको प्रार्थना तपाईंको मन व्यक्त गर्न मद्दत गर्ने <b>उदाहरण</b> मात्र हो।</p>
<div class="prayer">हे परमेश्‍वर,<br>म तपाईंलाई छोडेर आफ्नै इच्छाअनुसार बाँचेको पापी हुँ। मलाई क्षमा गर्नुहोस्।<br>येशू मेरा पापका निम्ति क्रूसमा मर्नुभयो र फेरि जीवित हुनुभयो भन्ने म विश्‍वास गर्छु।<br>अब म आफ्नो बाटोबाट फर्केर <b>येशूलाई मेरो मुक्तिदाता र प्रभुको रूपमा ग्रहण गर्छु।</b><br>अनन्त जीवनको वरदानका लागि धन्यवाद।<br>येशूको नाउँमा प्रार्थना गर्छु। <b>आमेन।</b></div>
<div class="btns"><button class="btn gold" id="amenBtn" onclick="amen()">🙏 मैले मन खोलेर यो प्रार्थना गरें</button></div>
<div id="amenBox"></div>
${Q('पश्‍चात्ताप गरेपछि म सिद्ध बन्नैपर्छ?','होइन। पश्‍चात्ताप सिद्ध बन्ने वाचा होइन, <b>दिशा बदल्नु</b> हो। हामी अझै ठेस खान्छौं, तर परमेश्‍वरका सन्तानहरू उहाँकहाँ फर्कन्छन्, क्षमा पाउँछन् र बढ्दै जान्छन् (1 यूहन्ना 1:9)।')}
${N('· एक-एक लाइन पहिले पढेर उहाँलाई दोहोर्‍याउन दिनु राम्रो हुन्छ।<br>· प्रार्थनापछि तुरुन्तै निश्चयताका पदहरूमा जानुहोस् — भावनामा होइन, परमेश्‍वरको प्रतिज्ञामा आधारित।')}`},
assure:{t:'निश्चयता',cap:'मृत्युदेखि जीवनमा प्रवेश',html:`
<div class="stepNo">१० · निश्चयता</div>
<h2>अनन्त जीवन<br>अहिले नै मेरो हो</h2>
<p>खाली ठाउँ थिचेर परमेश्‍वरको प्रतिज्ञा हेर्नुहोस्।</p>
<div class="verse green"><div class="ref">यूहन्ना 5:24</div><div class="tx">साँच्‍चै, म तिमीहरूलाई भन्‍दछु, जसले मेरो वचन सुन्‍छ र मलाई पठाउनुहुनेमाथि विश्‍वास गर्छ, त्‍यससित ${B('अनन्‍त जीवन छ')}। त्‍यो ${B('न्‍यायमा आउँदैन')}, तर मृत्‍युदेखि त्‍यसले ${B('जीवनमा प्रवेश गरेको छ')}।</div></div>
<div id="blankMsg"></div>
${V('1 यूहन्ना 5:11-13','गवाहीचाहिँ यही हो, कि परमेश्‍वरले हामीलाई अनन्‍त जीवन दिनुभयो, र यो जीवन उहाँका पुत्रमा छ। <b>जससँग पुत्र हुनुहुन्‍छ, त्‍यससँग जीवन छ,</b> जससँग परमेश्‍वरका पुत्र हुनुहुन्‍न, त्‍यससँग जीवन हुँदैन। <b>तिमीहरूले अनन्‍त जीवन पाएका छौ भन्‍ने कुरा जान</b> भन्‍ने हेतुले परमेश्‍वरका पुत्रको नाउँमा विश्‍वास गर्ने तिमीहरूलाई यो पत्र लेख्‍दैछु।','green')}
<p class="solo" style="font-size:.9em;color:var(--sub)">निश्चयता भावनामा होइन, <b>परमेश्‍वरको वचन</b>मा आधारित हुन्छ।</p>
${TRAIN('तथ्य','परमेश्‍वरको वचन','विश्‍वास','वचनमा भरोसा','भावना','पछि-पछि आउँछ')}
${Q('अहिलेसम्म निश्चित भइनँ भने ठीक छ?','ठीक छ। निश्चयता एकैचोटि आउँदैन; परमेश्‍वरको वचन पढ्दै जाँदा बढ्दै जान्छ। प्रश्नहरू छन् भने जुनसुकै बेला सोध्नुहोस्, र हरेक दिन यूहन्नाको सुसमाचारको एक अध्याय पढ्नुहोस्। इमानदारीसाथ खोज्नेहरूलाई परमेश्‍वरले भेट्नुहुन्छ।')}
${N('· काल हेर्नुहोस्: "पाउनेछ" होइन, "अनन्त जीवन छ", "प्रवेश गरेको छ" — पहिले नै भइसकेको।<br>· रेलको उदाहरण: इन्जिन (तथ्य) ले तान्छ, कोइलाको डिब्बा (विश्‍वास) ले शक्ति दिन्छ, पछाडिको डिब्बा (भावना) पछ्याउँछ।')}`},
next:{t:'अर्को कदम',cap:'परमेश्‍वरको पट्टि नयाँ जीवन सुरु हुन्छ',html:`
<div class="stepNo">११ · अर्को कदम</div>

let SHORT=false;
function rebuildNav(){
  $('#dots').innerHTML=steps.map(()=>'<i></i>').join('');
  $('#tocList').innerHTML=steps.map((s,i)=>`<button onclick="go(${i});toc(false)">${SHORT?i+1:(i===0?'·':i)}  ${s.t}</button>`).join('');
}
function setShort(on,target){
  SHORT=!!on; st.short=SHORT; save(); document.body.classList.toggle('short',SHORT);
  buildSteps(); rebuildNav(); toc(false); go(Math.min(target||0,steps.length-1),1);
}

const idx=id=>steps.findIndex(s=>s.id===id);
function buildSteps(){ const C=(SHORT?CONTENT_S:CONTENT)[st.lang](); steps=(SHORT?META_S:META).map(m=>({...m,...C[m.id]})); }

function setLang(l,keep){
  st.lang=l; save(); L=UI[l]; document.documentElement.lang=l==='zh'?'zh-CN':l;
  document.body.dataset.lang=l;
  $('#hTitle').textContent=L.title; $('#hSub').textContent=L.sub; $('#tocH').textContent=L.toc; $('#tocHelp').innerHTML=L.tocHelp; $('#fsLbl').textContent=L.fs;
  const T={tMan:L.man,tGod:L.god,tSin:L.sin,tJesus:L.jesus,tRisen:L.risen,tFree:L.free,tHear:L.hear,tBelieve:L.believe,m1:'1. '+L.manL[0],m2:'2. '+L.manL[1],m3:'3. '+L.manL[2],g1:'1. '+L.godL[0],g2:'2. '+L.godL[1],g3:'3. '+L.godL[2]};
  for(const k in T) $('#'+k).textContent=T[k];
  document.title=L.shareT;
  buildSteps();
  rebuildNav();
  [...document.querySelectorAll('#langPop button')].forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  $('#langPop').classList.remove('open');
  if(speaking) rdBarLabels();
  go(keep?cur:cur,0);
}

function setStage(cls){ stage.className=cls; $('#fillerG').style.setProperty('--fg',cls.includes('joined')?1:0); }
function go(i,dir){
  if(i<0||i>=steps.length)return;
  const prevCrossed=personX>200;
  cur=i; const s=steps[i];
  if(speaking){ rdGen++; clearTimeout(rdTimer); try{speechSynthesis.cancel()}catch(e){} restoreTyped(); }
  setStage(s.stage);
  $('#stageCap').textContent=s.cap;
  panel.innerHTML=s.html; wheelIntro(); panel.scrollTop=0; panel.classList.remove('fade'); void panel.offsetWidth; panel.classList.add('fade');
  [...$('#dots').children].forEach((d,k)=>d.classList.toggle('on',k===i));
  [...$('#tocList').children].forEach((d,k)=>d.classList.toggle('cur',k===i));
  $('#prev').disabled=i===0; $('#prev').style.opacity=i===0?.4:1;
  navLabels();
  const shouldCross=s.stage.includes('crossed')||((s.id==='pray'||s.id==='q_pray')&&prayed);
  if(!shouldCross&&prevCrossed) walkTo(85,500);
  if(s.enter) s.enter(dir);
  if((s.id==='pray'||s.id==='q_pray')&&prayed){$('#amenBtn').disabled=true;$('#amenBox').innerHTML=`<div class="card">${L.welcome}</div>`; const qa=$('#qAfter'); if(qa) qa.hidden=false;}
  document.body.classList.toggle('compact',i>0||SHORT);
  st.cur=i; save();
  if(speaking){ if(s.id==='start') go(1,1); else readStep({sin:1900,cross:1700,risen:1500}[s.id]||700); }
}
$('#next').onclick=()=>{ if(cur===steps.length-1){ if(SHORT) setShort(false,0); else go(0); } else go(cur+1,1); };
$('#prev').onclick=()=>go(cur-1,-1);

/* swipe */
let sx=0,sy=0,stt=0;
panel.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;stt=Date.now()},{passive:true});
