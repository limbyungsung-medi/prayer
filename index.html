function walkTo(x,ms=2200,cb){
  const P=$('#P'); const x0=personX, t0=performance.now();
  function f(t){ let k=Math.min(1,(t-t0)/ms); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    personX=x0+(x-x0)*e; const lift=-14*Math.max(0,Math.min(1,Math.min(personX-116,284-personX)/12));
    const bob=Math.abs(Math.sin(k*Math.PI*8))*2*(k<1?1:0);
    P.setAttribute('transform',`translate(${personX.toFixed(1)} ${lift-bob})`);
    if(k<1)requestAnimationFrame(f); else cb&&cb(); }
  requestAnimationFrame(f);
}
function setCrossed(on,animate){
  if(on){ if(personX<200){ if(animate) walkTo(295,2400,()=>stage.classList.add('crossed')); else { personX=295; $('#P').setAttribute('transform','translate(295 0)'); } } }
  else if(personX>200) walkTo(85,500);
}

/* ===== 읽어 주기 (🔊) =====
   켜 두면 화면을 넘겨도 계속 읽고, 한 화면을 다 읽으면 다음 화면으로 넘어간다.

   보기 방식: 'follow' = 읽는 부분을 강조하고 따라 올라감 / 'type' = 타자 치듯 글자가 나타남 */
let speaking=false, rdGen=0, rdTimer=null;
const STOP_AT=['respond','pray','summary','faq','q_pray'];
const CPS={ko:6.5,en:13,zh:4.2,ru:12,ne:10};

/* 읽을 덩어리: 화면 본문의 맨 위 칸들을 차례로 */
function skippable(el){
  return el.matches('.note,details,.btns,.langRow,svg,input,#cardBox,.stepNo,h2[style*="margin-top:16px"]') ||
    (el.classList.contains('solo') && document.body.classList.contains('together'));
}
function unitText(el){
  const c=el.cloneNode(true);
  c.querySelectorAll('.note,details,button,.btns,svg,input,textarea').forEach(e=>e.remove());
  c.querySelectorAll('.ref').forEach(r=>r.textContent=r.textContent+'. ');
  c.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));
  return c.textContent.replace(/\s*\n\s*/g,'\n').replace(/[ \t]+/g,' ').trim();
}
/* 타자 효과: 덩어리의 글자를 비웠다가 차례로 채운다 */
let typed=null;
function prepType(el){
  const nodes=[]; const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  while(tw.nextNode()){ const n=tw.currentNode; if(n.parentElement.closest('.note,details,.btns,svg')) continue; nodes.push([n,n.nodeValue]); }
  const total=nodes.reduce((a,[,t])=>a+t.length,0);
  nodes.forEach(([n])=>n.nodeValue='');
  typed={el,nodes,total,shown:0}; el.classList.add('typing-caret');
}
function showTyped(frac){
  if(!typed) return; const want=Math.round(typed.total*Math.min(1,frac)); if(want<=typed.shown) return;
  let left=want; for(const [n,t] of typed.nodes){ const k=Math.min(t.length,left); if(n.nodeValue.length!==k) n.nodeValue=t.slice(0,k); left-=k; if(left<=0) break; }
  typed.shown=want; keepVisible(typed.el,true);
}
function restoreTyped(){ if(!typed) return; typed.nodes.forEach(([n,t])=>n.nodeValue=t); typed.el.classList.remove('typing-caret'); typed=null; }
function keepVisible(el,bottom){
  const pr=panel.getBoundingClientRect(), r=el.getBoundingClientRect();
  if(bottom){ if(r.bottom>pr.bottom-24) panel.scrollTop+=r.bottom-(pr.bottom-24); }
  else el.scrollIntoView({block:'center',behavior:'smooth'});
}


/* 긴 문장은 2~3 덩어리로 더 잘게 나눈다 (쉼표·연결어미·띄어쓰기 기준) */
function splitChunks(text){
  const base=text.match(/[^.?!。？！।\n]+[.?!。？！।]*\s*|\n/g)||[text];
  const max=st.lang==='en'?90:st.lang==='ru'?80:st.lang==='ne'?70:st.lang==='zh'?28:36, out=[];
  const W=st.lang==='zh'?[[/[；：]/g,3],[/[，、]/g,2]]:(st.lang==='ru'||st.lang==='ne')?[[/[;:—]\s/g,3],[/,\s/g,2]]:st.lang==='en'?[[/[;:]\s/g,3],[/,\s/g,2],[/\s(and|but|that|so)\s/g,1]]:
    [[/(니라|이라|도다|리라|니이다|하더라)\s/g,4],[/(,\s|，)/g,3],[/(니|으며|하며|하고|하되|하여|하니)\s/g,2],[/(고|며|서|여|면|는데|지만)\s/g,1]];
  base.forEach(c=>{
    while(c.length>max*1.4){
      let best=-1,bw=0,bd=1e9;
      W.forEach(([re,w])=>{ re.lastIndex=0; let m; while((m=re.exec(c))){ const e=m.index+m[0].length; if(e<max*0.4||e>max*1.5||c.length-e<8) continue; const d=Math.abs(e-max); if(w>bw||(w===bw&&d<bd)){best=e;bw=w;bd=d;} } });
      if(best<0){ best=c.lastIndexOf(' ',max); best=best<max*0.4?max:best+1; }
      out.push(c.slice(0,best)); c=c.slice(best);
    }
    out.push(c);
  });
  return out;
}
let fol=null;
function prepFollow(el){
  const nodes=[]; const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  while(tw.nextNode()){ const n=tw.currentNode; if(n.parentElement.closest('.note,details,.btns,svg')) continue; nodes.push(n); }
  fol={el,nodes,total:nodes.reduce((a,n)=>a+n.nodeValue.length,0)};
  const pr=panel.getBoundingClientRect(), r=el.getBoundingClientRect();
  if(r.height>pr.height*0.6) panel.scrollTop+=r.top-pr.top-12; else keepVisible(el,false);
}
function posOf(k){ for(const n of fol.nodes){ if(k<=n.nodeValue.length) return [n,k]; k-=n.nodeValue.length; } const n=fol.nodes[fol.nodes.length-1]; return [n,n.nodeValue.length]; }
function markChunk(fa,fb){
  if(typed||!fol||!fol.nodes.length) return;
  try{
    const r=document.createRange(); const [n1,o1]=posOf(Math.floor(fa*fol.total)); const [n2,o2]=posOf(Math.ceil(fb*fol.total));
    r.setStart(n1,o1); r.setEnd(n2,o2);
    if(window.CSS&&CSS.highlights&&window.Highlight) CSS.highlights.set('rd',new Highlight(r));
    const rc=r.getBoundingClientRect(), pr=panel.getBoundingClientRect();
    if(rc.height&&(rc.top<pr.top+20||rc.bottom>pr.bottom-20)) panel.scrollBy({top:rc.top-(pr.top+pr.height*0.3),behavior:'smooth'});
  }catch(e){}
}
function prog(f){ if(typed) showTyped(f); }

function readStep(delay){
  const gen=++rdGen; clearTimeout(rdTimer);
  const typeMode=rdStyle()==='type';
  document.body.classList.toggle('reading-type',typeMode);
  const units=[...panel.children];
  if(typeMode) units.forEach(u=>{ if(!u.matches('.stepNo')) u.classList.add('rd-hide'); });
  panel.scrollTop=0;
  let i=0; const queue=[];
  let lang=L.tts, voice=voiceFor(lang); const rate=st.rate||0.95, cps=(CPS[st.lang]||7)*rate/0.95;
  /* 네팔어 음성이 없는 휴대폰: 같은 데바나가리 문자를 읽는 힌디어 음성으로 대신 읽는다 */
  if(!voice && st.lang==='ne'){ const hv=voiceFor('hi-IN'); if(hv){ lang='hi-IN'; voice=hv; if(!readStep._neHi){ readStep._neHi=1; toast('नेपाली आवाज नभएकाले हिन्दी आवाजले पढिँदैछ'); } } else if(!readStep._neNo){ readStep._neNo=1; toast('यो फोनमा नेपाली आवाज छैन — सेटिङ › पाठ-वाचन (TTS) मा नेपाली आवाज थप्नुहोस्'); } }
  const id=steps[cur].id;
  if(id==='gift') setTimeout(()=>{ if(gen===rdGen) openGift(); },2500);
  function next(){
    if(gen!==rdGen) return;
    restoreTyped(); fol=null; try{CSS.highlights&&CSS.highlights.delete('rd')}catch(e){} panel.querySelectorAll('.rd-now').forEach(e=>e.classList.remove('rd-now'));
    const live=[...panel.children];           /* 화면 중간에 새로 생긴 칸(판자 결과 등)도 읽는다 */
    let el=queue.length?queue.shift():live[i++];
    if(!el){ return stepDone(); }
    if(id==='effort'&&el.classList&&el.classList.contains('effBtns')){
      el.classList.remove('rd-hide'); $('#effortMsg').classList.remove('rd-hide');
      const b=[...el.querySelectorAll('.btn:not(.tried)')][0];
      if(b){ const idx=[...el.querySelectorAll('.btn')].indexOf(b); const out=tryPlank(b,idx)||[]; queue.push(...out); i--; return setTimeout(next,1200); }
      return next();
    }
    if(el.id==='effortMsg'&&el.dataset.read) return next();
    if(el.parentElement&&el.parentElement.id==='effortMsg') $('#effortMsg').dataset.read='1';
    el.classList.remove('rd-hide');
    if(skippable(el)) return next();
    const text=unitText(el);
    if(!text) return next();
    if(typeMode) prepType(el); else { el.classList.add('rd-now'); prepFollow(el); }
    const chunks=splitChunks(text);
    const S=chunks.join('').length; let off=0, ci=0;
    function say(){
      if(gen!==rdGen) return;
      if(ci>=chunks.length){ prog(1); return setTimeout(next,350); }
      const t=chunks[ci++]; const start=off; off+=t.length;
      if(!t.trim()) return say();
      const u=new SpeechSynthesisUtterance(spoken(t)); u.lang=lang; if(voice)u.voice=voice; u.rate=rate;
      let t0=0, bound=false, tick=null;
      markChunk(start/S,off/S);
      u.onstart=()=>{ t0=performance.now(); if(typeMode) tick=setInterval(()=>{ if(!bound) prog(Math.min(off,start+(performance.now()-t0)/1000*cps)/S); },60); };
      u.onboundary=e=>{ if(typeof e.charIndex==='number'){ bound=true; prog(Math.min(off,start+e.charIndex+(e.charLength||2))/S); } };
      u.onend=u.onerror=()=>{ clearInterval(tick); if(gen!==rdGen) return; prog(off/S); say(); };
      speechSynthesis.speak(u);
    }
    say();
  }
  function stepDone(){
    if(gen!==rdGen) return;
    panel.querySelectorAll('.rd-hide').forEach(e=>e.classList.remove('rd-hide'));
    if(STOP_AT.includes(id) || cur>=steps.length-1){ toast(L.rdWait); return; }
    rdTimer=setTimeout(()=>{ if(gen===rdGen&&speaking) go(cur+1,1); },1400);
  }
  rdTimer=setTimeout(next,delay||0);
}



/* 성경 장·절을 소리 내어 읽기 좋게 바꾸기 */
function sino(n){ n=+n; const d=['','일','이','삼','사','오','육','칠','팔','구']; let r='';
  const h=Math.floor(n/100), t=Math.floor(n%100/10), o=n%10;
  if(h) r+=(h>1?d[h]:'')+'백'; if(t) r+=(t>1?d[t]:'')+'십'; if(o) r+=d[o]; return r||'영'; }
const KO_BOOKS={'롬':'로마서','사':'이사야','요':'요한복음','엡':'에베소서','요일':'요한일서','히':'히브리서','벧전':'베드로전서','고전':'고린도전서','계':'요한계시록','잠':'잠언','창':'창세기','마':'마태복음'};
function spoken(t){
  if(st.lang==='ko'){
    t=t.replace(/(^|[\s(（—])(요일|벧전|고전|롬|사|요|엡|히|계|잠|창|마)\s+(?=\d)/g,(m,a,b)=>a+KO_BOOKS[b]+' ');
    t=t.replace(/(\d+):(\d+)\s*-\s*(\d+)/g,(m,a,b,c)=>`${sino(a)}장 ${sino(b)}절에서 ${sino(c)}절`);
    t=t.replace(/(\d+):(\d+)/g,(m,a,b)=>`${sino(a)}장 ${sino(b)}절`);
    t=t.replace(/(\d+)\s*장/g,(m,a)=>sino(a)+'장').replace(/(\d+)\s*절/g,(m,a)=>sino(a)+'절');
  } else if(st.lang==='zh'){
    t=t.replace(/(\d+):(\d+)\s*-\s*(\d+)/g,'$1章$2节到$3节').replace(/(\d+):(\d+)/g,'$1章$2节');
  } else if(st.lang==='ru'){
    t=t.replace(/(\d+):(\d+)\s*-\s*(\d+)/g,'глава $1, стихи с $2 по $3').replace(/(\d+):(\d+)/g,'глава $1, стих $2');
  } else if(st.lang==='ne'){
    t=t.replace(/(\d+):(\d+)\s*-\s*(\d+)/g,'अध्याय $1, पद $2 देखि $3').replace(/(\d+):(\d+)/g,'अध्याय $1, पद $2');
  } else {
    t=t.replace(/(\d+):(\d+)\s*-\s*(\d+)/g,'chapter $1, verses $2 to $3').replace(/(\d+):(\d+)/g,'chapter $1, verse $2');
  }
  return t;
}
/* ---------- spiritual birthday card ---------- */
function makeCard(){
  const name=($('#bdName').value||'').trim()||L.me, d=$('#bdDate').value||new Date().toISOString().slice(0,10);
  const [y,m,dd]=d.split('-').map(Number);
  const c=document.createElement('canvas'); c.width=1080;c.height=1350; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,1350); g.addColorStop(0,'#14213a'); g.addColorStop(1,'#2c5282'); x.fillStyle=g; x.fillRect(0,0,1080,1350);
  x.fillStyle='#2E3A78'; x.fillRect(0,820,400,530); x.fillRect(680,820,400,530);
  x.fillStyle='#D4B15A'; x.fillRect(0,816,400,5); x.fillRect(680,816,400,5);
  const gl=x.createRadialGradient(540,780,10,540,780,330); gl.addColorStop(0,'rgba(255,242,184,.85)'); gl.addColorStop(1,'rgba(255,242,184,0)'); x.fillStyle=gl; x.fillRect(150,420,780,720);

const EMO_RE=new RegExp('('+Object.keys(EMO).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\s?','g');
function ic(n){ return `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`; }
function iconizeDom(root){
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ const p=n.parentElement; if(!p||p.closest('svg,textarea,input,script,style'))return NodeFilter.FILTER_REJECT; EMO_RE.lastIndex=0; EMO_DROP.lastIndex=0; return (EMO_RE.test(n.nodeValue)||EMO_DROP.test(n.nodeValue))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }});
  const nodes=[]; while(tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(n=>{ const t=n.nodeValue.replace(EMO_DROP,''); const span=document.createElement('span'); span.innerHTML=t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(EMO_RE,(m,e)=>ic(EMO[e])); const f=document.createDocumentFragment(); while(span.firstChild) f.appendChild(span.firstChild); n.parentNode.replaceChild(f,n); });
}
const stripEmo=t=>String(t).replace(EMO_DROP,'').replace(EMO_RE,'').trim();

const BOOKS_EN='Genesis,Gen|Exodus,Exod|Leviticus,Lev|Numbers,Num|Deuteronomy,Deut|Joshua,Josh|Judges,Judg|Ruth|1 Samuel,1 Sam|2 Samuel,2 Sam|1 Kings,1 Kgs|2 Kings,2 Kgs|1 Chronicles,1 Chr|2 Chronicles,2 Chr|Ezra|Nehemiah,Neh|Esther,Esth|Job|Psalms,Psalm,Ps|Proverbs,Prov|Ecclesiastes,Eccl|Song of Songs,Song of Solomon|Isaiah,Isa|Jeremiah,Jer|Lamentations,Lam|Ezekiel,Ezek|Daniel,Dan|Hosea,Hos|Joel|Amos|Obadiah,Obad|Jonah|Micah,Mic|Nahum,Nah|Habakkuk,Hab|Zephaniah,Zeph|Haggai,Hag|Zechariah,Zech|Malachi,Mal|Matthew,Matt|Mark|Luke|John|Acts|Romans,Rom|1 Corinthians,1 Cor|2 Corinthians,2 Cor|Galatians,Gal|Ephesians,Eph|Philippians,Phil|Colossians,Col|1 Thessalonians,1 Thess|2 Thessalonians,2 Thess|1 Timothy,1 Tim|2 Timothy,2 Tim|Titus|Philemon,Phlm|Hebrews,Heb|James,Jas|1 Peter,1 Pet|2 Peter,2 Pet|1 John|2 John|3 John|Jude|Revelation,Rev';
const BOOKS_ZH='创世记,创|出埃及记,出|利未记,利|民数记,民|申命记,申|约书亚记,书|士师记,士|路得记,得|撒母耳记上,撒上|撒母耳记下,撒下|列王纪上,王上|列王纪下,王下|历代志上,代上|历代志下,代下|以斯拉记,拉|尼希米记,尼|以斯帖记,斯|约伯记,伯|诗篇,诗|箴言,箴|传道书,传|雅歌,歌|以赛亚书,赛|耶利米书,耶|耶利米哀歌,哀|以西结书,结|但以理书,但|何西阿书,何|约珥书,珥|阿摩司书,摩|俄巴底亚书,俄|约拿书,拿|弥迦书,弥|那鸿书,鸿|哈巴谷书,哈|西番雅书,番|哈该书,该|撒迦利亚书,亚|玛拉基书,玛|马太福音,太|马可福音,可|路加福音,路|约翰福音,约|使徒行传,徒|罗马书,罗|哥林多前书,林前|哥林多后书,林后|加拉太书,加|以弗所书,弗|腓立比书,腓|歌罗西书,西|帖撒罗尼迦前书,帖前|帖撒罗尼迦后书,帖后|提摩太前书,提前|提摩太后书,提后|提多书,多|腓利门书,门|希伯来书,来|雅各书,雅|彼得前书,彼前|彼得后书,彼后|约翰一书,约壹|约翰二书,约贰|约翰三书,约叁|犹大书,犹|启示录,启';
const BOOKMAP={};
[BOOKS_KO,BOOKS_EN,BOOKS_ZH].forEach(t=>t.split('|').forEach((g,i)=>g.split(',').forEach(n=>{BOOKMAP[n]=i+1})));
const BOOK_RE_SRC=Object.keys(BOOKMAP).sort((a,b)=>b.length-a.length).map(n=>n.replace(/ /g,'\\s')).join('|');
/* 책 이름 + 장:절(-절)  또는 같은 책의 이어지는 장:절 (", 10:10" / "; 59:2" / "；10:10") */
const REF_RE=new RegExp(`(^|[^A-Za-z가-힣0-9])(${BOOK_RE_SRC})\\s?(\\d{1,3}):(\\d{1,3})(?:\\s?-\\s?(\\d{1,3}))?|([,;，；]\\s?)(\\d{1,3}):(\\d{1,3})(?:\\s?-\\s?(\\d{1,3}))?`,'g');

/* 화면 안의 구절 주소를 누를 수 있게 만든다 */
function linkifyRefs(root){
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    const p=n.parentElement; if(!p||p.closest('.vref,script,style,textarea,input,button,svg,summary'))return NodeFilter.FILTER_REJECT;
    return /\d:\d/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const nodes=[]; while(tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(node=>{
    const t=node.nodeValue; let last=0, book=0, m, frag=document.createDocumentFragment(), hit=false;
    REF_RE.lastIndex=0;
    while((m=REF_RE.exec(t))){
      let pre, b, ch, v1, v2, start;
      if(m[2]){ pre=m[1]; b=BOOKMAP[m[2].replace(/\s/g,' ')]||BOOKMAP[m[2]]; ch=m[3]; v1=m[4]; v2=m[5]; start=m.index+pre.length; book=b; }
      else { if(!book) continue; pre=m[6]; b=book; ch=m[7]; v1=m[8]; v2=m[9]; start=m.index+pre.length; }
      if(!b) continue;
      frag.appendChild(document.createTextNode(t.slice(last,start)));
      const a=document.createElement('span'); a.className='vref'; a.textContent=t.slice(start,m.index+m[0].length);
      a.dataset.go=`${b}.${ch}.${v1}${v2?'-'+v2:''}`; frag.appendChild(a);
      last=m.index+m[0].length; hit=true;
    }
    if(!hit) return;
    frag.appendChild(document.createTextNode(t.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
}
document.addEventListener('click',e=>{ const a=e.target.closest('.vref'); if(!a)return; e.preventDefault(); e.stopPropagation(); openBible(a.dataset.go); },true);
